<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A logo da Programação Makro: a folha do calendário com o dia da
       programação marcado e dado por feito. Sem emoji: só forma. -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="dia" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#fundo)"/>
  <!-- a sombra da folha, levemente deslocada: dá o volume -->
  <rect x="13" y="18" width="38" height="34" rx="7" fill="#1e3a8a" opacity=".35"/>
  <!-- a folha -->
  <rect x="12" y="15" width="38" height="34" rx="7" fill="#ffffff"/>
  <!-- a faixa do mês -->
  <path d="M12 22a7 7 0 0 1 7-7h24a7 7 0 0 1 7 7v2H12z" fill="#dbe6ff"/>
  <!-- as argolas -->
  <rect x="20" y="10" width="5" height="10" rx="2.5" fill="#ffffff" stroke="#1e40af" stroke-width="2"/>
  <rect x="37" y="10" width="5" height="10" rx="2.5" fill="#ffffff" stroke="#1e40af" stroke-width="2"/>
  <!-- os dias -->
  <g fill="#b6c8ee">
    <rect x="17" y="29" width="6" height="5" rx="1.6"/>
    <rect x="25" y="29" width="6" height="5" rx="1.6"/>
    <rect x="33" y="29" width="6" height="5" rx="1.6"/>
    <rect x="41" y="29" width="5" height="5" rx="1.6"/>
    <rect x="17" y="37" width="6" height="5" rx="1.6"/>
    <rect x="25" y="37" width="6" height="5" rx="1.6"/>
  </g>
  <!-- o dia marcado, saindo da folha, com o visto -->
  <rect x="32" y="34" width="20" height="17" rx="5" fill="url(#dia)" stroke="#ffffff" stroke-width="2.5"/>
  <path d="M37 42.5l3.4 3.4 6.6-6.8" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
