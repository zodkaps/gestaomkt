 oficina:"Oficina",fornecedor:"Fornecedor",custo:"Custo estimado",obs:"Observações",registro:"Data/hora da ocorrência"};
function fmtCampoRF(k,v){
 if(v===null||v===undefined||v==="")return "—";
 if(k==="status")return (ST[v]||{l:v}).l;
 if(k==="criticidade"||k==="prioridade")return (CRI[v]||{l:v}).l;
 if(k==="severidade")return (SEV[v]||{l:v}).l;
 if(k==="statusOp")return (STVEIC[v]||{l:v}).l;
 if(k==="tipoRF")return (TIPO_RF[v]||{l:v}).l;
 if(k==="itens")return (v&&v.length)?v.length+" falha(s): "+v.map(function(x){return x.sistema;}).join(", "):"—";
 if(k==="registro"||k==="dataPrev")return dt(v);
 if(k==="custo")return R$(v);
 return String(v);
}
function salvarFalha(editId){
 const g=i=>{const e=document.getElementById(i);return e?String(e.value).trim():"";};
 const convertendo=window._convSol||null;   // guardado antes de qualquer fechar()
 const tipoRF=g("x-tipoRF")||"pcm";
 let frota=g("x-frota").toUpperCase();
 const descricao=g("x-descricao");
 const motoristaId=g("x-motorista")||null;   // UUID é texto: parseInt zerava o vínculo
 // Item 56: a frota é o identificador obrigatório; a placa é complementar e opcional.
 const osNum=g("x-os");
 // A OS é aberta no Protheus; aqui ela é obrigatória para registrar e validar o RF.
 if(!osNum)return alert("Informe o número da Ordem de Serviço (aberta no Protheus).\n\nTodo registro de falha precisa estar vinculado a uma OS.");
 if(!frota)return alert("Informe o número da frota.");
 // Resolve o que foi digitado para uma frota real. Sem isso, "423" virava um
 // veículo fantasma e o RF ficava órfão, sem aparecer na frota certa.
 const resF=resolverFrota(frota);
 if(!resF.ok){
  if(resF.motivo==="ambigua")
   return alert('Existe mais de uma frota com o número "'+frota+'": '+resF.opcoes.join(", ")+
    '.\n\nDigite o número completo.');
  if(!confirm('A frota "'+frota+'" não está cadastrada.\n\n'+
    'Confira se não faltou o prefixo (ex.: F-'+String(frota).replace(/\D/g,"")+').\n\n'+
    'Deseja mesmo CADASTRAR uma frota nova com o nome "'+frota+'"?'))return;
 }else{
  frota=resF.frota;   // grava sempre o nome exato do cadastro
 }
 if(!g("x-sistema"))return alert("Selecione o sistema afetado.");
 if(!descricao)return alert("Descreva a falha.");
 // Item 47: o motorista só é obrigatório no RF do Motorista.
 if(tipoRF==="motorista"&&!motoristaId)
  return alert('No "RF do Motorista" é obrigatório informar quem conduzia.\n\nSe a falha foi identificada pela equipe em inspeção ou análise, selecione "RF Interno (PCM)" — nesse caso o motorista não é exigido.');
 const ds=g("x-data"),hs=g("x-hora")||"00:00";
 const ts=ds?new Date(ds+"T"+hs).getTime():Date.now();
 // Arquivos selecionados: sobem para o Storage quando há nuvem;
 // sem nuvem, guardamos só o nome (o navegador não persiste o arquivo).
 const arquivosRF=[];
 ["x-fotos","x-videos","x-docs"].forEach(function(id){const inp=document.getElementById(id);
  if(inp&&inp.files)Array.prototype.slice.call(inp.files).forEach(function(f){arquivosRF.push(f);});});
 const novosAnexos=arquivosRF.map(function(f){
  return{nome:f.name,tipo:tipoAnexo(f.type),tam:f.size};});
 const status=g("x-status")||"aberta";
 const statusOp=g("x-statusOp")||"operando";
 // Se o usuário não mexeu no campo, não mexemos no status da frota.
 const statusOpMudou=statusOp!==(g("x-statusOp0")||statusOp);
 const itens=lerItensFalha({sistema:g("x-sistema"),componente:g("x-componente"),
  criticidade:g("x-criticidade"),descricao:descricao,causa:g("x-causa")});
 const campos={osProtheus:osNum,itens:itens,frota:frota,placa:g("x-placa").toUpperCase(),tipoRF:tipoRF,
  motorista:motoristaId?nomeMot(motoristaId):"",motoristaId:motoristaId,
  modelo:g("x-modelo"),fabricante:g("x-fabricante"),filial:g("x-filial"),
  km:parseInt(g("x-km"))||0,local:g("x-local"),sistema:g("x-sistema"),componente:g("x-componente"),
  descricao:descricao,sintoma:g("x-sintoma"),causa:g("x-causa"),
  severidade:g("x-severidade"),criticidade:g("x-criticidade"),prioridade:g("x-prioridade"),
  status:status,statusOp:statusOp,responsavel:g("x-responsavel"),
  dataPrev:g("x-dataprev")?new Date(g("x-dataprev")+"T00:00:00").getTime():null,
  oficina:g("x-oficina"),fornecedor:g("x-fornecedor"),custo:parseInt(g("x-custo"))||0,
  obs:g("x-obs"),registro:ts};
 let fal=DB.falhas();
 if(editId){
  const antigo=fal.find(x=>String(x.id)===String(editId));
  if(!antigo)return;
  // Item 48: cada alteração gera histórico com usuário, data/hora, campo, valor anterior e novo valor.
  const usuario=S.sessao?S.sessao.nome:"—",agora=Date.now(),mudancas=[];
  Object.keys(campos).forEach(function(k){
   if(k==="motoristaId")return;
   const de=antigo[k],para=campos[k];
   if(String(de==null?"":de)===String(para==null?"":para))return;
   mudancas.push({ts:agora,usuario:usuario,campo:ROTULOS_RF[k]||k,de:fmtCampoRF(k,de),para:fmtCampoRF(k,para)});
  });
  if(novosAnexos.length)mudancas.push({ts:agora,usuario:usuario,campo:"Evidências",
   de:((antigo.anexos||[]).length)+" arquivo(s)",para:((antigo.anexos||[]).length+novosAnexos.length)+" arquivo(s)"});
  const atualizado=Object.assign({},antigo,campos,{
   anexos:(antigo.anexos||[]).concat(novosAnexos),
   hist:(antigo.hist||[]).concat(mudancas),
   liberacao:status==="liberada"?(antigo.liberacao||Date.now()):null});
  DB.setFalhas(fal.map(x=>String(x.id)===String(editId)?atualizado:x));
  DB.log("editar","falha",frota+" · "+campos.sistema,
   mudancas.length?("Alterado: "+mudancas.map(m=>m.campo).join(", ").slice(0,90)):"Nenhuma alteração");
  toast(mudancas.length?"Registro atualizado":"Nenhuma alteração",
   mudancas.length?(mudancas.length+" campo(s) alterado(s) · histórico registrado"):"Os dados continuam iguais","ok");
 }else{
  const nova=Object.assign({id:Math.max.apply(null,[0].concat(fal.map(r=>r.id)))+1},campos,{
   cidade:(DB.veiculos().find(v=>v.frota===frota)||{}).cidade||"",
   anexos:novosAnexos,hist:[],criadoPor:S.sessao?S.sessao.nome:"—",
   liberacao:status==="liberada"?Date.now():null});
  fal.unshift(nova);DB.setFalhas(fal);
  DB.log("criar","falha",frota+" · "+nova.sistema,TIPO_RF[tipoRF].l+" — "+descricao.slice(0,60));
  if(convertendo){
   window._convSol=null;
   concluirConversao(convertendo,nova);
   toast("Solicitação convertida","Registro de falha criado para a frota "+frota,"ok");
  }else{
   toast("Falha registrada",TIPO_RF[tipoRF].l+" · Frota "+frota,"ok");
  }
 }
 // Item 50: ao salvar o RF o status operacional da frota é atualizado em todo o sistema.
 const vs=DB.veiculos(),idx=vs.findIndex(v=>v.frota===frota);
 if(idx<0){
  vs.push({frota:frota,placa:campos.placa,modelo:campos.modelo,fabricante:campos.fabricante,marca:campos.fabricante,
   ano:null,km:campos.km,filial:campos.filial,cidade:"",tipo:"",implemento:"Nenhum",capacidade:"",chassi:"",renavam:"",
   horimetro:0,statusVeic:statusOp,aquisicao:null,ultimaManut:null,proximaManut:null,
   obsTec:"Cadastrado ao registrar o RF "+osNum+" — confirme os dados do veículo.",fotos:[],docs:[]});
  DB.setVeiculos(vs);DB.log("criar","veiculo",frota,"Cadastrado ao registrar falha (confirmado pelo usuário)");
  toast("Frota nova cadastrada",frota+" foi criada. Complete os dados em Frotas.","aviso");
 }else if(statusOpMudou&&(vs[idx].statusVeic||"operando")!==statusOp){
  const antes=vs[idx].statusVeic||"operando";
  vs[idx]=Object.assign({},vs[idx],{statusVeic:statusOp});
  DB.setVeiculos(vs);
  DB.log("status","veiculo",frota,"Status operacional: "+(STVEIC[antes]||{l:antes}).l+" para "+(STVEIC[statusOp]||{l:statusOp}).l);
 }
 // Anexos reais: precisam do id do banco, que só existe depois da gravação.
 if(SUPA.ativo&&arquivosRF.length){
  const marcaId=editId||null;
  toast("Enviando anexos",arquivosRF.length+" arquivo(s)…","info");
  Promise.resolve(DB._ultimaSync).then(function(){
   const alvo=marcaId
    ? DB.falhas().find(function(x){return String(x.id)===String(marcaId);})
    : DB.falhas()[0];
   if(!alvo||!alvo._uid)throw new Error("O registro ainda não tinha sido gravado na nuvem.");
   return enviarAnexos(alvo._uid,arquivosRF,"rf");
  }).then(function(){
   return carregarDoSupabase();
  }).then(function(){
   render();toast("Anexos enviados",arquivosRF.length+" arquivo(s) salvos no registro.","ok");
  }).catch(function(e){
   toast("Falha nos anexos",(e.message||e)+" — o registro foi salvo, mas os arquivos não.","erro");
  });
 }
 fechar();render();
}

/* Anexa arquivos a um RF já existente, direto do detalhe */
function anexarNoRF(id){
 if(!pode("editar"))return;
 const r=DB.falhas().find(function(x){return String(x.id)===String(id);});
 if(!r)return;
 if(!SUPA.ativo)return alert("O envio de arquivos funciona quando o sistema está conectado à nuvem.\n\nNo modo local só é possível registrar o nome do arquivo, pelo formulário de edição.");
 const inp=document.createElement("input");
 inp.type="file";inp.multiple=true;
 inp.accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx";
 inp.onchange=function(){
  const arquivos=Array.prototype.slice.call(inp.files||[]);
  if(!arquivos.length)return;
  toast("Enviando anexos",arquivos.length+" arquivo(s)…","info");
  enviarAnexos(r._uid,arquivos,"rf")
   .then(function(){return carregarDoSupabase();})
   .then(function(){
    render();
    const atual=DB.falhas().find(function(x){return String(x._uid)===String(r._uid);});
    if(atual)verFalha(atual.id);
    toast("Anexos enviados",arquivos.length+" arquivo(s) salvos no registro.","ok");
   })
   .catch(function(e){alert("Não foi possível enviar: "+(e.message||e));});
 };
 inp.click();
}
function mudarStatus(id,st){
 const fal=DB.falhas().map(function(r){if(String(r.id)!==String(id))return r;
  const u=Object.assign({},r,{status:st});
  if(st==="liberada"&&!u.liberacao)u.liberacao=Date.now();
  if(st!=="liberada")u.liberacao=null;return u;});
 DB.setFalhas(fal);
 const r=fal.find(x=>String(x.id)===String(id));
 DB.log("status","falha",r.frota+" · "+r.sistema,"Status alterado para "+ST[st].l);toast("Status atualizado",r.frota+" "+mi("arrowRight")+" "+ST[st].l,"info");
 fecharDrawer();render();verFalha(id);
}
function salvarObsFalha(id){

 DB.setFalhas(DB.falhas().map(r=>String(r.id)===String(id)?Object.assign({},r,{obs:t}):r));

function excluirFalha(id){

 fecharDrawer();render();
}

const COLS=["osProtheus","frota","placa","registro","motorista","km","local","sistema","componente","descricao","sintoma","causa",
 "severidade","criticidade","status","oficina","fornecedor","modelo","fabricante","cidade","filial","custo","liberacao","obs"];
const CABS=["OS Protheus","Frota","Placa","Data/Hora","Motorista","KM","Local","Sistema","Componente","Descricao","Sintoma","Causa",
 "Severidade","Criticidade","Status","Oficina","Fornecedor","Modelo","Fabricante","Cidade","Filial","Custo","Liberacao","Observacoes"];
function baixar(blob,nome){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nome;a.click();}
function linhasExport(){
 return filtrar(DB.falhas()).map(function(r){return COLS.map(function(c){
  let v=r[c];
  if(c==="registro"||c==="liberacao")v=v?new Date(v).toLocaleString("pt-BR"):"";
  if(c==="severidade")v=(SEV[v]||{l:v}).l;
  if(c==="criticidade")v=(CRI[v]||{l:v}).l;
  if(c==="status")v=(ST[v]||{l:v}).l;
  return v==null?"":v;});});
}
function exportar(tipo){
 const dados=linhasExport(),hoje=new Date().toISOString().slice(0,10);
 if(tipo==="xlsx"&&typeof XLSX!=="undefined"){
  const ws=XLSX.utils.aoa_to_sheet([CABS].concat(dados));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Falhas");
  XLSX.writeFile(wb,"falhas_makro_"+hoje+".xlsx");
  DB.log("exportar","falhas","","XLSX com "+dados.length+" registros");return;}
 const csv="\uFEFF"+CABS.join(";")+"\n"+dados.map(l=>l.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(";")).join("\n");
 baixar(new Blob([csv],{type:"text/csv;charset=utf-8"}),"falhas_makro_"+hoje+".csv");
 DB.log("exportar","falhas","","CSV com "+dados.length+" registros");
}

  '<button class="b1" onclick="processarCSV()">Importar</button></div></div>');

function processarCSV(){
 const f=document.getElementById("imp-f").files[0];
 if(!f)return alert("Selecione um arquivo CSV.");
 const rd=new FileReader();
 rd.onload=function(e){try{
  const txt=e.target.result.replace(/^\uFEFF/,"");
  const linhas=txt.split(/\r?\n/).filter(l=>l.trim());
  if(linhas.length<2)return alert("Arquivo sem dados.");
  const sep=linhas[0].indexOf(";")>=0?";":",";
  const cab=linhas[0].split(sep).map(h=>h.replace(/^"|"$/g,"").trim().toLowerCase());
  const ix=n=>cab.findIndex(h=>h.indexOf(n)===0);
  const I={frota:ix("frota"),placa:ix("placa"),data:ix("data"),motorista:ix("motorista"),km:ix("km"),
   local:ix("local"),sistema:ix("sistema"),comp:ix("componente"),desc:ix("descri"),sint:ix("sintoma"),
   causa:ix("causa"),sev:ix("sever"),crit:ix("critic"),st:ix("status"),ofi:ix("oficina"),
   forn:ix("fornec"),mod:ix("modelo"),fab:ix("fabric"),cid:ix("cidade"),fil:ix("filial"),custo:ix("custo")};
  if(I.frota<0||I.placa<0)return alert("Cabeçalho inválido: as colunas Frota e Placa são obrigatórias.");
  const parse=function(l){const out=[];let cur="",q=false;
   for(let k=0;k<l.length;k++){const ch=l[k];
    if(ch==='"'){if(q&&l[k+1]==='"'){cur+='"';k++;}else q=!q;}
    else if(ch===sep&&!q){out.push(cur);cur="";}else cur+=ch;}
   out.push(cur);return out.map(s=>s.trim());};
  const chave=function(t){const m={leve:"leve",moder:"moderada",grave:"grave",crit:"critica",
   baixa:"baixa",media:"media","médi":"media",alta:"alta",urgen:"urgente",
   abert:"aberta","anális":"analise",analis:"analise",aguard:"aguardando",liber:"liberada"};
   const s=(t||"").toLowerCase();for(const k in m)if(s.indexOf(k)>=0)return m[k];return null;};
  const fal=DB.falhas();let novoId=Math.max.apply(null,[0].concat(fal.map(r=>r.id))),add=0;
  for(let n=1;n<linhas.length;n++){
   const c=parse(linhas[n]);if(!c[I.frota])continue;
   const val=(i,d)=>i>=0&&c[i]?c[i]:d;
   let ts=Date.now();
   if(I.data>=0&&c[I.data]){const p=c[I.data].match(/(\d{2})\/(\d{2})\/(\d{2,4})[, ]*(\d{2})?:?(\d{2})?/);
    if(p){const ano=p[3].length===2?"20"+p[3]:p[3];ts=new Date(+ano,+p[2]-1,+p[1],+(p[4]||0),+(p[5]||0)).getTime();}
    else{const d2=new Date(c[I.data]);if(!isNaN(d2))ts=d2.getTime();}}
   const st=chave(val(I.st,"aberta"))||"aberta";
   fal.push({id:++novoId,frota:c[I.frota].toUpperCase(),placa:val(I.placa,"").toUpperCase(),
    motorista:val(I.motorista,"—"),km:parseInt(val(I.km,0))||0,local:val(I.local,""),
    sistema:val(I.sistema,"Outros"),componente:val(I.comp,""),descricao:val(I.desc,"(sem descrição)"),
    sintoma:val(I.sint,""),causa:val(I.causa,""),
    severidade:chave(val(I.sev,""))||"moderada",criticidade:chave(val(I.crit,""))||"media",
    status:st,oficina:val(I.ofi,""),fornecedor:val(I.forn,"—"),modelo:val(I.mod,""),
    fabricante:val(I.fab,""),cidade:val(I.cid,""),filial:val(I.fil,""),
    custo:parseInt(val(I.custo,0))||0,registro:ts,liberacao:st==="liberada"?ts+36e5:null,obs:"",anexos:[]});
   add++;}
  DB.setFalhas(fal);DB.log("importar","falhas","",add+" registros importados de "+f.name);
  fechar();render();alert(add+" falha(s) importada(s) com sucesso.");
 }catch(err){alert("Não foi possível ler o arquivo. Verifique o formato.");}};
 rd.readAsText(f,"UTF-8");
}

function fechar(){const d=document.getElementById("ov");if(d)d.remove();window._convSol=null;}
function abrirDrawer(html){fecharDrawer();const d=document.createElement("div");d.className="ov";d.id="ovd";
 d.style.justifyContent="flex-end";d.onclick=e=>{if(e.target===d)fecharDrawer();};
 d.innerHTML=html;document.body.appendChild(d);}
function fecharDrawer(){const d=document.getElementById("ovd");if(d)d.remove();}

/* ═══ ATALHOS ═══ */
/* Item 51: atalhos de teclado para as ações mais usadas */
document.addEventListener("keydown",function(e){
 const emCampo=/^(INPUT|TEXTAREA|SELECT)$/.test((e.target&&e.target.tagName)||"");
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();if(S.sessao)buscaGlobal();}
 if(e.key==="Escape"){fecharBusca();fechar();fecharDrawer();}
 if(!S.sessao||emCampo||e.ctrlKey||e.metaKey||e.altKey)return;
 const k=e.key.toLowerCase();
 if(k==="n"&&pode("criar")){e.preventDefault();modalFalha(S.frotaAtiva||null);}
 else if(k==="f"){e.preventDefault();
  const i=document.getElementById("fq")||document.getElementById("fqs")||document.getElementById("fsq");
  if(i)i.focus();}
 else if(k==="?"||(e.shiftKey&&k==="/")){e.preventDefault();
  alert("Atalhos de teclado\n\nN — Novo registro de falha\nF — Ir para o campo de busca\nCtrl+K — Busca global\nEsc — Fechar janela aberta");}
});

/* ═══ INICIALIZAÇÃO ═══ */
function splash(){
 const d=document.createElement("div");d.id="splash";
 d.innerHTML='<div style="display:flex;flex-direction:column;align-items:center;gap:15px">'+
  '<div style="animation:fadeUp .5s cubic-bezier(.16,1,.3,1)"><img src="'+LOGO_WORDMARK+'" style="width:180px;border-radius:10px;box-shadow:var(--sh2)" alt="Makro"></div>'+
  '<div style="text-align:center;animation:fadeUp .5s .08s cubic-bezier(.16,1,.3,1) both">'+
   '<div style="font-size:12px;font-weight:700;color:var(--t2);letter-spacing:.4px">'+SISTEMA_NOME+'</div></div>'+
  '<div class="spbar" style="margin-top:6px"><i></i></div>'+
  '<div style="font-size:10.5px;color:var(--t3);animation:fadeIn .6s .3s both">Carregando análise de frota…</div></div>';
 document.body.appendChild(d);
 setTimeout(function(){d.classList.add("gone");setTimeout(function(){d.remove();},480);},1080);
}
(async function(){
 favicon();
 const c=DB.cfg();S.tema=c.tema||"dark";S.menu=c.menu!==false;
 document.documentElement.setAttribute("data-theme",S.tema);
 splash();

 // A base local SEMPRE é preparada, mesmo com a nuvem configurada.
 // Ela garante o catálogo de componentes (que não existe no Supabase) e
 // um acesso de emergência caso o banco ainda não esteja pronto.
 await semear();
 importarFrotaPlanilha();

 if(supaConfigurado()&&initSupabase()){
  try{
   const {data}=await SUPA.client.auth.getSession();
   if(data&&data.session&&data.session.user){
    const ok=await iniciarSessaoSupabase(data.session.user);
    if(ok){render();return;}
   }
  }catch(e){SUPA.erro=e.message;}
  render();return;                       // configurado mas sem sessão → tela de login
 }

 try{const s=localStorage.getItem("sgfpro:sessao")||sessionStorage.getItem("sgfpro:sessao");if(s)S.sessao=JSON.parse(s);}catch(e){}
 if(S.sessao){restaurarView();DB.backupAuto();}
 render();
})();
</script>
