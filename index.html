<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestão de Análise de Falhas MKT</title>
<meta name="application-name" content="Gestão de Análise de Falhas MKT">
<meta name="description" content="Plataforma de PCM para gestão e análise de falhas da frota — apoio à tomada de decisão, sem substituir o Protheus na abertura de Ordens de Serviço.">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root[data-theme="dark"]{
 --bg:#080D17;--s1:#0F1729;--s2:#141E33;--s3:#18233C;--s4:#1F2D4A;--bd:#22304E;--bd2:#2E4066;
 --t1:#EAF1FB;--t2:#94A8C6;--t3:#63799B;--ac:#3B82F6;--ac2:#60A5FA;--acs:#3B82F620;
 --ok:#22C55E;--wr:#F59E0B;--cr:#EF4444;--in:#38BDF8;--rx:#8B5CF6;--cy:#14B8A6;--pk:#EC4899;--or:#F97316;
 --btx:#FFFFFF;--glow:0 0 0 1px #3B82F62A;
 --sh:0 4px 24px rgba(0,0,0,.4);--sh2:0 24px 70px rgba(0,0,0,.6);
}
:root[data-theme="light"]{
 --bg:#F2F5FA;--s1:#FFFFFF;--s2:#FFFFFF;--s3:#F4F7FC;--s4:#E8EDF6;--bd:#DDE4EF;--bd2:#C3CFE0;
 --t1:#0F1B2D;--t2:#54657D;--t3:#8093AC;--ac:#1D4ED8;--ac2:#2563EB;--acs:#1D4ED814;
 --ok:#059669;--wr:#D97706;--cr:#DC2626;--in:#0284C7;--rx:#7C3AED;--cy:#0D9488;--pk:#DB2777;--or:#EA580C;
 --btx:#FFFFFF;--glow:0 0 0 1px #1D4ED81A;
 --sh:0 2px 14px rgba(15,27,45,.07);--sh2:0 22px 55px rgba(15,27,45,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--t1);font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
button,input,select,textarea{font-family:inherit;color:inherit}
input::placeholder,textarea::placeholder{color:var(--t3)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:4px}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideR{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.fu{animation:fadeUp .35s cubic-bezier(.16,1,.3,1) both}
.d1{animation-delay:.04s}.d2{animation-delay:.08s}.d3{animation-delay:.12s}.d4{animation-delay:.16s}
.lgw{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden}
.lgw::before{content:'';position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,var(--acs) 0%,transparent 65%);top:-380px;left:50%;transform:translateX(-50%)}
.lgc{background:var(--s1);border:1px solid var(--bd);border-radius:20px;padding:38px 34px;width:100%;max-width:410px;box-shadow:var(--sh2);position:relative;animation:fadeUp .45s cubic-bezier(.16,1,.3,1)}
.lgl{width:58px;height:58px;border-radius:16px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 18px;box-shadow:0 8px 24px var(--acs)}
.app{display:flex;min-height:100vh}
aside{width:234px;background:var(--s1);border-right:1px solid var(--bd);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:40;transition:width .22s cubic-bezier(.4,0,.2,1)}
aside.col{width:64px}
.abr{height:60px;display:flex;align-items:center;gap:10px;padding:0 15px;border-bottom:1px solid var(--bd);flex-shrink:0}
.alg{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.anav{flex:1;padding:12px 10px;overflow-y:auto;overflow-x:hidden}
.ngr{font-size:9.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--t3);font-weight:700;padding:12px 10px 6px}
.ni{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;font-size:13px;font-weight:500;color:var(--t2);cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:.15s;margin-bottom:2px;position:relative;white-space:nowrap}
.ni:hover{background:var(--s3);color:var(--t1)}
.ni.on{background:var(--acs);color:var(--ac);font-weight:600}
.nic{width:19px;text-align:center;flex-shrink:0;font-size:15px;display:flex;align-items:center;justify-content:center}
.nic-svg{transition:transform .22s cubic-bezier(.16,1,.3,1)}
.ni:hover .nic-svg{transform:scale(1.14)}
.ni.on .nic-svg{transform:scale(1.06)}
html{scroll-behavior:smooth}
aside.col .nlb,aside.col .ngr{display:none}
aside.col .abt{padding:8px}
aside.col .abt .uinfo{display:none}
aside.col .abt>div{padding:6px;justify-content:center}
aside.col .ni{justify-content:center;padding:9px}
.abt{padding:12px;border-top:1px solid var(--bd)}
main{flex:1;margin-left:234px;transition:margin-left .22s cubic-bezier(.4,0,.2,1);min-width:0}
main.col{margin-left:64px}
@media(max-width:860px){aside{width:64px}aside .nlb,aside .ngr,aside .abt{display:none}aside .ni{justify-content:center;padding:9px}main{margin-left:64px}}
header{height:60px;background:var(--s1);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:14px;position:sticky;top:0;z-index:30}
.gsb{flex:1;max-width:460px;display:flex;align-items:center;gap:9px;background:var(--s3);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;cursor:pointer;transition:.15s}
.gsb:hover{border-color:var(--ac)}
.kbd{font-size:10px;background:var(--s1);border:1px solid var(--bd2);border-radius:4px;padding:2px 6px;color:var(--t3);font-weight:600}
.wrap{padding:22px 24px 60px;max-width:1720px;margin:0 auto}
.pg{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.pgt{font-size:22px;font-weight:700;letter-spacing:-.4px;margin-bottom:3px}
.pgs{font-size:12.5px;color:var(--t2)}
.kpis{display:grid;gap:12px;margin-bottom:16px;grid-template-columns:repeat(auto-fit,minmax(196px,1fr))}
/* 5 indicadores numa grade de 4 deixavam um card sozinho com um vazio enorme ao
   lado. Nesses casos o último ocupa o espaço restante em vez de ficar órfão. */
@media(min-width:900px){
 .kpis:has(> .kpi:nth-child(5):last-child) > .kpi:nth-child(5){grid-column:span 2}
 .kpis:has(> .kpi:nth-child(7):last-child) > .kpi:nth-child(7){grid-column:span 2}
}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:14px;transition:.2s}
.card:hover{border-color:var(--bd2);transform:translateY(-2px)}
.kpi{padding:16px 17px;position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;right:-14px;top:-14px;width:64px;height:64px;border-radius:50%;opacity:.09;background:currentColor}
.kico{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;margin-bottom:11px}
.kv{font-size:26px;font-weight:800;line-height:1;letter-spacing:-.9px;margin-bottom:5px}
.kl{font-size:12px;font-weight:600;color:var(--t1)}
.ks{font-size:10.5px;color:var(--t2);margin-top:2px}
.pn{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:18px 19px;margin-bottom:14px}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.pt{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.ps{font-size:11.5px;color:var(--t2);margin-top:2px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g21{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
@media(max-width:1180px){.g3{grid-template-columns:1fr 1fr}}
@media(max-width:900px){.g2,.g3,.g21{grid-template-columns:1fr}}
.inp{background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:8px 11px;font-size:12.5px;outline:none;width:100%;transition:.15s}
.inp:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
select.inp{cursor:pointer}
label.cp{display:flex;flex-direction:column;gap:5px}
label.cp>span{font-size:10px;color:var(--t2);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:10px}
.b1{background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--btx);border:none;padding:9px 15px;border-radius:9px;font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.b1:hover{transform:translateY(-1px);box-shadow:0 5px 16px var(--acs)}
.b2{background:var(--s3);border:1px solid var(--bd);padding:8px 13px;border-radius:9px;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.b2:hover{background:var(--s4);border-color:var(--bd2)}
.b3{background:none;border:none;cursor:pointer;color:var(--t2);padding:6px;border-radius:7px;display:inline-flex;transition:.15s;font-size:15px}
.b3:hover{background:var(--s3);color:var(--t1)}
.tabs{display:inline-flex;gap:3px;background:var(--s3);border:1px solid var(--bd);border-radius:10px;padding:3px;flex-wrap:wrap}
.tb{padding:6px 13px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:none;color:var(--t2);transition:.15s}
.tb.on{background:var(--s1);color:var(--t1);box-shadow:var(--sh)}
.tag{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:5px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;padding:10px 11px;color:var(--t2);font-size:10px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:10px 11px;border-bottom:1px solid var(--bd)}
tbody tr{cursor:pointer;transition:.12s}
tbody tr:hover{background:var(--s3)}
tbody tr:last-child td{border-bottom:none}
.tw{overflow-x:auto}
.ov{position:fixed;inset:0;background:rgba(4,8,14,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;animation:fadeIn .18s ease}
.md{background:var(--s1);border:1px solid var(--bd);border-radius:17px;padding:24px;width:100%;max-width:740px;max-height:92vh;overflow-y:auto;box-shadow:var(--sh2);animation:fadeUp .3s cubic-bezier(.16,1,.3,1)}
.dr{width:520px;max-width:96vw;height:100%;background:var(--s1);border-left:1px solid var(--bd);padding:22px;overflow-y:auto;box-shadow:var(--sh2);animation:slideR .3s cubic-bezier(.16,1,.3,1)}
.ln{display:flex;justify-content:space-between;align-items:center;padding:10px 13px;gap:12px;background:var(--s1)}
.ln>span:first-child{font-size:11.5px;color:var(--t2)}
.ln>span:last-child{font-size:12.5px;font-weight:600;text-align:right}
.bbg{height:7px;background:var(--s3);border-radius:4px;overflow:hidden}
.bfl{height:100%;border-radius:4px;transform-origin:left;animation:grow .55s cubic-bezier(.16,1,.3,1)}
.rk{display:flex;align-items:center;gap:11px;cursor:pointer;padding:7px 8px;border-radius:9px;transition:.15s}
.rk:hover{background:var(--s3)}
.alert{border-radius:11px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;margin-bottom:9px;border:1px solid;transition:.15s}
svg text{font-family:'Inter','Segoe UI',sans-serif}
.lgd{display:flex;gap:13px;flex-wrap:wrap;font-size:11px;color:var(--t2);margin-top:9px}
.lgi{display:flex;align-items:center;gap:5px}
.sw{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.gso{position:fixed;inset:0;background:rgba(4,8,14,.72);backdrop-filter:blur(5px);z-index:300;display:flex;align-items:flex-start;justify-content:center;padding:80px 20px;animation:fadeIn .16s}
.gsm{background:var(--s1);border:1px solid var(--bd);border-radius:16px;width:100%;max-width:620px;box-shadow:var(--sh2);overflow:hidden;animation:fadeUp .25s cubic-bezier(.16,1,.3,1)}
.gsi{display:flex;align-items:center;gap:11px;padding:16px 18px;border-bottom:1px solid var(--bd)}
.gsi input{background:none;border:none;outline:none;font-size:15px;width:100%}
.gsr{max-height:400px;overflow-y:auto;padding:8px}
.gsx{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;cursor:pointer;transition:.12s}
.gsx:hover{background:var(--s3)}
.gsc{font-size:9px;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);font-weight:700;padding:9px 12px 5px}
.tl{position:relative;padding-left:26px}
.tl::before{content:'';position:absolute;left:7px;top:5px;bottom:5px;width:2px;background:var(--bd)}
.tli{position:relative;padding-bottom:14px}

/* ═══ CAMADA PREMIUM ═══ */
html{scroll-behavior:smooth}
body{background-image:radial-gradient(1200px 600px at 85% -10%,var(--acs),transparent 70%);background-attachment:fixed}
.card,.pn{box-shadow:var(--sh);position:relative}
.card::before,.pn::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
 background:linear-gradient(180deg,rgba(255,255,255,.045),transparent 42%);opacity:.9}
:root[data-theme="light"] .card::before,:root[data-theme="light"] .pn::before{background:linear-gradient(180deg,rgba(255,255,255,.9),transparent 46%)}
.card{transition:transform .22s cubic-bezier(.16,1,.3,1),box-shadow .22s,border-color .22s}
.card:hover{transform:translateY(-3px);box-shadow:var(--sh2),var(--glow)}
.kpi .kv{background:linear-gradient(180deg,var(--t1),color-mix(in srgb,var(--t1) 72%,transparent));-webkit-background-clip:text;background-clip:text}
.kico{box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 22%,transparent)}
.b1{box-shadow:0 2px 10px color-mix(in srgb,var(--ac) 34%,transparent),inset 0 1px 0 rgba(255,255,255,.18)}
.b1:active,.b2:active{transform:translateY(1px) scale(.99)}
.b2,.b3,.ni,.tb,.rk,.gsx{transition:all .18s cubic-bezier(.16,1,.3,1)}
.ni.on{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ac) 26%,transparent)}
tbody tr{transition:background .16s,box-shadow .16s}
tbody tr:hover{box-shadow:inset 3px 0 0 var(--ac)}
.inp{transition:border-color .18s,box-shadow .18s,background .18s}
.tag{transition:transform .15s}
.pn .pt{letter-spacing:-.2px}

/* Skeleton loading */
@keyframes shimmer{0%{background-position:-460px 0}100%{background-position:460px 0}}
.skl{background:linear-gradient(90deg,var(--s3) 8%,var(--s4) 18%,var(--s3) 33%);
 background-size:920px 100%;animation:shimmer 1.15s linear infinite;border-radius:8px}
.skl-kpi{height:104px;border-radius:14px}
.skl-line{height:13px;margin-bottom:9px}
.skl-chart{height:196px;border-radius:12px}

/* Toasts */
#toasts{position:fixed;right:18px;bottom:18px;z-index:400;display:flex;flex-direction:column;gap:9px;pointer-events:none}
.toast{background:var(--s1);border:1px solid var(--bd);border-left:3px solid var(--ac);border-radius:11px;
 padding:11px 15px;box-shadow:var(--sh2);min-width:250px;max-width:360px;display:flex;gap:10px;align-items:flex-start;
 animation:tin .32s cubic-bezier(.16,1,.3,1);pointer-events:auto}
.toast.out{animation:tout .28s ease forwards}
@keyframes tin{from{opacity:0;transform:translateX(28px) scale(.97)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateX(28px) scale(.97)}}
.toast .tt{font-size:12.5px;font-weight:700;margin-bottom:2px}
.toast .td{font-size:11.5px;color:var(--t2);line-height:1.45}

/* Tooltip de gráfico */
#gtip{position:fixed;z-index:500;background:var(--s1);border:1px solid var(--bd2);border-radius:11px;
 padding:10px 13px;box-shadow:var(--sh2);font-size:12px;pointer-events:none;opacity:0;transition:opacity .13s;
 max-width:270px;line-height:1.5}
#gtip.on{opacity:1}
/* Paginação */
.pgn{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
 padding:11px 2px 2px;border-top:1px solid var(--bd);margin-top:10px}
.pgn-i{font-size:11.5px;color:var(--t2)}
.pgn-b{display:flex;gap:5px;align-items:center}
.pgn-b button{background:var(--s3);border:1px solid var(--bd);color:var(--t1);border-radius:7px;
 padding:5px 10px;font-size:11.5px;cursor:pointer;min-width:32px;transition:.14s}
.pgn-b button:hover:not(:disabled){border-color:var(--ac);color:var(--ac)}
.pgn-b button.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.pgn-b button:disabled{opacity:.4;cursor:default}
/* Filtro pesquisável: campo de texto + lista rolante no mesmo controle */
.cbx{position:relative}
.cbx input{width:100%;padding-right:30px}
.cbx .cbx-b{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;
 color:var(--t3);cursor:pointer;padding:3px;display:flex;transition:.15s}
.cbx .cbx-b:hover{color:var(--ac)}
.cbx-l{position:absolute;left:0;right:0;top:calc(100% + 3px);background:var(--s2);border:1px solid var(--bd2);
 border-radius:10px;box-shadow:var(--sh2);max-height:210px;overflow-y:auto;z-index:60;display:none;padding:4px}
.cbx-l.on{display:block}
.cbx-l div{padding:7px 10px;font-size:12px;border-radius:7px;cursor:pointer;white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis}
.cbx-l div:hover{background:var(--s3)}
.cbx-l div.sel{background:var(--acs);color:var(--ac);font-weight:700}
.cbx-l .vazio{color:var(--t3);cursor:default;font-style:italic}
.cbx-l .vazio:hover{background:none}
/* ═══ Agenda semanal de programação ═══ */
.agw{display:grid;grid-template-columns:150px repeat(7,minmax(120px,1fr));gap:1px;
 background:var(--bd);border:1px solid var(--bd);border-radius:12px;overflow:hidden;min-width:900px}
.agh{background:var(--s2);padding:9px 8px;font-size:10.5px;font-weight:800;text-transform:uppercase;
 letter-spacing:.5px;color:var(--t2);text-align:center;position:sticky;top:0;z-index:5}
.agh.hoje{background:var(--acs);color:var(--ac)}
.agh b{display:block;font-size:15px;color:var(--t1);margin-top:2px;letter-spacing:0}
.agh.hoje b{color:var(--ac)}
.agr{background:var(--s2);padding:10px;font-size:12px;display:flex;flex-direction:column;
 justify-content:center;gap:2px;position:sticky;left:0;z-index:4}
.agr b{font-size:12.5px}
.agr span{font-size:10.5px;color:var(--t2)}
.agc{background:var(--s1);padding:5px;min-height:64px;display:flex;flex-direction:column;gap:4px;
 transition:background .14s}
.agc:hover{background:var(--s3)}
.agc.hoje{background:color-mix(in srgb,var(--ac) 4%,var(--s1))}
.agt{border-radius:7px;padding:5px 7px;font-size:10.5px;line-height:1.35;cursor:pointer;
 border-left:3px solid;background:var(--s3);transition:.14s}
.agt:hover{transform:translateX(1px);filter:brightness(1.15)}
.agt b{display:block;font-size:10.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Detalhe da tarefa: modal centralizado, duas colunas */
.md-tar{max-width:760px}
.tar-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:15px}
.tar-rot{font-size:10px;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.tar-box{background:var(--s3);border:1px solid var(--bd);border-radius:10px;padding:11px 13px;
 font-size:12.5px;line-height:1.55}
.tar-acoes{display:flex;gap:9px;margin-top:18px;padding-top:15px;border-top:1px solid var(--bd);flex-wrap:wrap}
/* Checklist */
.chk-barra{height:5px;border-radius:3px;background:var(--bd);overflow:hidden;margin-bottom:9px}
.chk-barra i{display:block;height:100%;border-radius:3px;transition:width .25s}
.chk-lista{display:flex;flex-direction:column;gap:5px;max-height:270px;overflow-y:auto}

 _k:{v:"sgfpro:veiculos",f:"sgfpro:falhas",u:"sgfpro:usuarios",a:"sgfpro:auditoria",c:"sgfpro:cfg",m:"sgfpro:motoristas",cp:"sgfpro:componentes",sol:"sgfpro:solicitacoes",listas:"sgfpro:listas",

/* A alocação de equipe fica numa tabela própria: o sincronizar() genérico
   grava só as colunas da tarefa, então a equipe some ao recarregar.
   Aqui reescrevemos os vínculos de cada tarefa alterada. */
async function sincronizarEquipes(tarefas){
 if(!SUPA.ativo||!SUPA.client)return;
 SUPA.pendentes++;
 try{
  // A ordem já é garantida por quem chama (setTarefas encadeia após gravar a tarefa).
  for(let i=0;i<tarefas.length;i++){
   const t=tarefas[i];
   if(!t._uid)continue;
   const atual=(t.equipe||[]).slice().sort().join(",");
   if(SYNC_EQUIPE[t._uid]===atual)continue;       // nada mudou
   const {error:e1}=await SUPA.client.from("tarefa_equipe").delete().eq("tarefa_id",t._uid);
   if(e1)throw e1;
   if((t.equipe||[]).length){
    const linhas=t.equipe.map(function(mid){return{tarefa_id:t._uid,mao_de_obra_id:mid};});
    const {error:e2}=await SUPA.client.from("tarefa_equipe").insert(linhas);
    if(e2)throw e2;
   }
   SYNC_EQUIPE[t._uid]=atual;
  }
  SUPA.ultimaSync=Date.now();
 }catch(e){
  if(typeof toast==="function")
   toast("Falha ao gravar a equipe",msgErroSupa(e)+" — a alocação ficou só neste navegador.","erro");
 }finally{ SUPA.pendentes--; }
}

/* ─── Criação de usuário direto pelo app ───
   Usamos signUp() com a chave pública num cliente separado, para não trocar a
   sessão do administrador. O perfil NUNCA vai no cadastro: o banco cria todo
   mundo como 'solicitante' e o admin promove logo em seguida, por RPC. */
async function criarUsuarioNuvem(nome,email,senha,perfil){
 if(!window.supabase||!window.supabase.createClient)throw new Error("Biblioteca do Supabase indisponível.");
 const tmp=window.supabase.createClient(SUPA.url,SUPA.key,
   {auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:"sb-tmp-"+Date.now()}});
 const {data,error}=await tmp.auth.signUp({email:email,password:senha,options:{data:{nome:nome}}});
 if(error){
  if(/already registered|already exists|User already|duplicate/i.test(error.message||"")){
   modalContaOrfa(nome,email,perfil);
   throw new Error("__tratado__");
  }
  throw error;
 }
 if(!data||!data.user)throw new Error("O cadastro não retornou o usuário.");
 // Dá um instante para o gatilho criar o profile
 await new Promise(function(r){setTimeout(r,600);});
 const {error:e2}=await SUPA.client.from("profiles").update({nome:nome}).eq("id",data.user.id);
 if(e2)throw new Error("Conta criada, mas o nome não pôde ser gravado: "+e2.message);
 if(perfil&&perfil!=="solicitante"){
  const {error:e3}=await SUPA.client.rpc("definir_perfil_usuario",{p_usuario_id:data.user.id,p_perfil:perfil});
  if(e3)throw new Error("Conta criada como Solicitante, mas o perfil não pôde ser alterado: "+e3.message);
 }
 await carregarDoSupabase();
 return data.user;
}

/* Converte a solicitação em RF usando a função do banco (transação única) */
/* ─── Anexos reais no Supabase Storage ───
   O arquivo vai para o bucket privado "solicitacoes"; a tabela guarda o caminho.
   Para exibir, geramos uma URL assinada temporária. */
function tipoAnexo(mime){
 if(/^image\//.test(mime||""))return "foto";
 if(/^video\//.test(mime||""))return "video";
 if(/^audio\//.test(mime||""))return "audio";
 return "documento";
}
function nomeSeguro(n){
 return String(n||"arquivo").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .replace(/[^\w.\-]/g,"_").slice(-80);
}
const MAX_ANEXO=20*1024*1024;   // 20 MB por arquivo
/* Onde cada tipo de anexo é guardado. O bucket é privado: a leitura
   acontece sempre por URL assinada e temporária. */
const DESTINO_ANEXO={
 solicitacao:{bucket:"solicitacoes",tabela:"solicitacao_anexos",chave:"solicitacao_id"},
 rf:{bucket:"anexos",tabela:"rf_anexos",chave:"rf_id"}
};
/* Sobe arquivos e registra os anexos. `alvo` é "solicitacao" ou "rf". */
async function enviarAnexos(donoId,arquivos,alvo){
 const d=DESTINO_ANEXO[alvo||"solicitacao"];
 if(!SUPA.ativo||!arquivos||!arquivos.length)return [];
 const registros=[];
 for(let i=0;i<arquivos.length;i++){
  const f=arquivos[i];
  if(f.size>MAX_ANEXO){
   throw new Error('"'+f.name+'" tem '+tamanhoLegivel(f.size)+
    ' e passa do limite de '+tamanhoLegivel(MAX_ANEXO)+' por arquivo.');
  }
  const caminho=donoId+"/"+Date.now()+"-"+i+"-"+nomeSeguro(f.name);
  const {error}=await SUPA.client.storage.from(d.bucket).upload(caminho,f,{upsert:false});
  if(error)throw new Error('Falha ao enviar "'+f.name+'": '+error.message);
  const reg={arquivo:caminho,nome_original:f.name,tipo:tipoAnexo(f.type),
   tamanho_bytes:f.size,mime_type:f.type,enviado_por:S.sessao?S.sessao.id:null,_bucket:d.bucket};
  reg[d.chave]=donoId;
  registros.push(reg);
 }
 const {error}=await SUPA.client.from(d.tabela)
  .insert(registros.map(function(r){const c=Object.assign({},r);delete c._bucket;return c;}));
 if(error)throw new Error("Arquivos enviados, mas o registro falhou: "+error.message);

function tamanhoLegivel(b){

}

/* ─── Carga inicial: traz tudo para o cache ─── */
async function carregarDoSupabase(){
 if(!SUPA.client)return false;
 SUPA.carregando=true;SUPA.erro=null;
 try{
  const [rv,rf,rm,rs,rp,rc,rl,ra,rt,rmo]=await Promise.all([
   SUPA.client.from("veiculos").select("*").order("frota"),
   SUPA.client.from("registros_falha").select("*, veiculos(frota,placa,modelo,marca,filial,cidade), rf_anexos(arquivo,nome_original,tipo,tamanho_bytes)").order("ocorrido_em",{ascending:false}),
   SUPA.client.from("motoristas").select("*").order("nome"),
   SUPA.client.from("solicitacoes").select("*, veiculos(frota,placa,filial), solicitacao_anexos(id,arquivo,nome_original,tipo,tamanho_bytes,mime_type)").order("created_at",{ascending:false}),
   SUPA.client.from("profiles").select("*"),
   SUPA.client.from("componentes").select("*").order("nome"),
   SUPA.client.from("config_listas").select("*"),
   SUPA.client.from("auditoria").select("*").order("created_at",{ascending:false}).limit(400),
   SUPA.client.from("tarefas").select("*, veiculos(frota), tarefa_equipe(mao_de_obra_id)").order("data_inicio"),
   SUPA.client.from("mao_de_obra").select("*").order("nome")
  ]);
  // Tabelas essenciais: sem elas não há sistema.
  const err=[rv,rf,rm,rs,rp].map(function(r){return r.error;}).filter(Boolean)[0];
  if(err)throw err;
  // Tabelas de módulos posteriores: se a migration ainda não foi rodada, o
  // sistema entra normalmente e apenas o módulo correspondente fica vazio.
  const faltando=[];
  [[rc,"componentes","10_compartilhado"],[rl,"config_listas","10_compartilhado"],
   [ra,"auditoria","10_compartilhado"],[rt,"tarefas","15_programacao"],
   [rmo,"mao_de_obra","15_programacao"]].forEach(function(x){
   if(x[0].error)faltando.push(x[2]);});
  SUPA.faltamScripts=uniq(faltando);
  CACHE.veiculos=(rv.data||[]).map(veicFromDB);
  CACHE.falhas=(rf.data||[]).map(falhaFromDB);
  CACHE.motoristas=(rm.data||[]).map(motFromDB);
  CACHE.solicitacoes=(rs.data||[]).map(solFromDB);
  CACHE.profiles=(rp.data||[]).map(function(p){
   return{id:p.id,_uid:p.id,login:p.email||"",nome:p.nome,perfil:p.perfil,ativo:p.ativo!==false,criado:_isoMs(p.created_at)};});
  marcarSincronizado("veiculos",CACHE.veiculos,veicToDB);
  marcarSincronizado("falhas",CACHE.falhas,falhaToDB);
  marcarSincronizado("motoristas",CACHE.motoristas,motToDB);
  CACHE.componentes=((rc.error?null:rc.data)||[]).map(compFromDB);
  CACHE.listas=(function(){const o={};((rl.error?null:rl.data)||[]).forEach(function(x){o[x.chave]=x.valores||[];});
   return Object.keys(o).length?o:null;})();
  CACHE.auditoria=((ra.error?null:ra.data)||[]).map(function(a){
   return{ts:_isoMs(a.created_at),usuario:a.usuario_nome||"—",acao:a.acao,
    entidade:a.entidade||"",alvo:a.alvo||"",detalhe:a.detalhe||""};});
  marcarSincronizado("solicitacoes",CACHE.solicitacoes,solToDB);
  CACHE.tarefas=((rt.error?null:rt.data)||[]).map(tarefaFromDB);
  CACHE.mdo=((rmo.error?null:rmo.data)||[]).map(mdoFromDB);
  marcarSincronizado("componentes",CACHE.componentes,compToDB);
  marcarSincronizado("tarefas",CACHE.tarefas,tarefaToDB);
  marcarEquipesSincronizadas(CACHE.tarefas);
  marcarSincronizado("mdo",CACHE.mdo,mdoToDB);
  SUPA.ultimaSync=Date.now();SUPA.carregando=false;
  return true;
 }catch(e){
  SUPA.carregando=false;
  SUPA.erro=msgErroSupa(e);
  return false;
 }
}

/* ─── Sincronização: compara a lista nova com o cache e envia as diferenças ─── */
async function sincronizar(tabela,chaveCache,novaLista,paraDB){
 if(!SUPA.ativo||!SUPA.client)return;
 const base=SYNCED[chaveCache]||{};
 const inserir=[],atualizar=[],vistos={};
 (novaLista||[]).forEach(function(item){
  if(item._uid){
   vistos[item._uid]=1;
   const antes=base[item._uid],agora=JSON.stringify(paraDB(item));
   if(antes===undefined||antes!==agora)atualizar.push(item);
  }else inserir.push(item);
 });
 const remover=Object.keys(base).filter(function(u){return !vistos[u];});
 if(!inserir.length&&!atualizar.length&&!remover.length)return;

 SUPA.pendentes++;
 try{
  for(let i=0;i<inserir.length;i++){
   const {data,error}=await SUPA.client.from(tabela).insert(paraDB(inserir[i])).select().single();
   if(error)throw error;
   inserir[i]._uid=data.id;                       // guarda o id do banco no objeto local
   if(data.numero)inserir[i].id=data.numero;
  }
  for(let i=0;i<atualizar.length;i++){
   const {error}=await SUPA.client.from(tabela).update(paraDB(atualizar[i])).eq("id",atualizar[i]._uid);
   if(error)throw error;
  }
  for(let i=0;i<remover.length;i++){
   const {error}=await SUPA.client.from(tabela).delete().eq("id",remover[i]);
   if(error)throw error;
  }
  marcarSincronizado(chaveCache,novaLista,paraDB);
  SUPA.ultimaSync=Date.now();
 }catch(e){
  if(typeof toast==="function")
   toast("Falha ao gravar na nuvem",msgErroSupa(e)+" — a alteração ficou salva apenas neste navegador.","erro");
 }finally{
  SUPA.pendentes--;
  if(typeof render==="function"&&SUPA.pendentes===0)render();
 }
}

/* As listas de configuração são chave→array, não uma lista de registros:
   sincronizamos com upsert por chave. */
async function sincronizarListas(obj){
 if(!SUPA.ativo||!SUPA.client)return;
 SUPA.pendentes++;
 try{
  const linhas=Object.keys(obj||{}).map(function(k){
   return{chave:k,valores:obj[k]||[],updated_by:S.sessao?S.sessao.id:null};});
  if(linhas.length){
   const {error}=await SUPA.client.from("config_listas").upsert(linhas,{onConflict:"chave"});
   if(error)throw error;
  }
  SUPA.ultimaSync=Date.now();
 }catch(e){
  if(typeof toast==="function")
   toast("Falha ao salvar configurações",msgErroSupa(e)+" — a alteração ficou só neste navegador.","erro");
 }finally{
  SUPA.pendentes--;
  if(typeof render==="function"&&SUPA.pendentes===0)render();
 }
}
/* Mensagem clara quando falta rodar uma migration */
function msgErroSupa(e){
 const m=(e&&e.message)?e.message:String(e||"erro");
 if(/column .*os_protheus/i.test(m))return "falta rodar o script 07_ordem_servico.sql no Supabase";
 if(/column .*itens/i.test(m))return "falta rodar o script 09_multi_falha.sql no Supabase";
 if(/config_listas|componentes|auditoria/i.test(m)&&/does not exist|schema cache/i.test(m))
  return "falta rodar o script 10_compartilhado.sql no Supabase";
 if(/does not exist|schema cache|relation/i.test(m))
  return "uma tabela/coluna não existe no banco — confira se todos os scripts SQL foram executados ("+m+")";
 return m;
}
/* ─── Tempo real: outra pessoa alterou algo → recarrega ─── */
let _realtimeOn=false;
function ligarRealtime(){
 if(!SUPA.client||_realtimeOn)return;
 try{
  const canal=SUPA.client.channel("mkt-sync")
   .on("postgres_changes",{event:"*",schema:"public",table:"registros_falha"},agendarRecarga)
   .on("postgres_changes",{event:"*",schema:"public",table:"solicitacoes"},agendarRecarga)
   .on("postgres_changes",{event:"*",schema:"public",table:"veiculos"},agendarRecarga)
   .on("postgres_changes",{event:"*",schema:"public",table:"motoristas"},agendarRecarga)
   .on("postgres_changes",{event:"*",schema:"public",table:"profiles"},agendarRecarga)
   .on("postgres_changes",{event:"*",schema:"public",table:"solicitacao_anexos"},agendarRecarga)
   .on("postgres_changes",{event:"*",schema:"public",table:"rf_anexos"},agendarRecarga)
   .subscribe(function(estado){
    SUPA.realtime=(estado==="SUBSCRIBED");
    // Se o canal cair (rede oscilando, aba dormindo), tenta voltar
    if(estado==="CHANNEL_ERROR"||estado==="TIMED_OUT"||estado==="CLOSED"){
     _realtimeOn=false;
     setTimeout(function(){if(SUPA.ativo&&!_realtimeOn)ligarRealtime();},4000);
    }
   });
  SUPA._canal=canal;
  _realtimeOn=true;
  // Rede voltou ou o usuário voltou para a aba: busca o que perdeu
  if(!SUPA._ouvintes){
   SUPA._ouvintes=true;
   window.addEventListener("online",agendarRecarga);
   document.addEventListener("visibilitychange",function(){
    if(!document.hidden&&SUPA.ativo)agendarRecarga();});
  }
 }catch(e){/* sem tempo real não é crítico */}
}
let _recargaTimer=null;
function agendarRecarga(){
 // Antes descartávamos o aviso quando havia gravação em andamento — e era
 // justamente aí que a alteração de outra pessoa se perdia. Agora só adiamos.
 clearTimeout(_recargaTimer);
 _recargaTimer=setTimeout(async function(){
  if(SUPA.pendentes>0){agendarRecarga();return;}   // tenta de novo em seguida
  // Não recarrega por baixo de um formulário aberto: o usuário perderia o que digitou
  if(document.getElementById("ov")){agendarRecarga();return;}
  if(await carregarDoSupabase()&&typeof render==="function")render();
 },900);
}

async function recarregarSupabase(){
 if(!SUPA.ativo)return;
 const ok=await carregarDoSupabase();
 render();
 toast(ok?"Dados atualizados":"Não foi possível atualizar",
   ok?"Sincronizado com o Supabase agora.":(SUPA.erro||""),ok?"ok":"erro");
}

async function hashSenha(txt){
 const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(txt));
 return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

function dur(ms){if(ms==null)return"—";const h=Math.floor(ms/36e5),d=Math.floor(h/24);
 // Antes saía "2d 0h" e "4h 0m" — o zero à direita é ruído visual.
 if(d>0)return (h%24)?d+"d "+(h%24)+"h":d+"d";

 return h>0?(m?h+"h "+m+"m":h+"h"):m+"m";}

function importarFrotaPlanilha(){
 if(localStorage.getItem("sgfpro:import_frota_v1"))return;
 const veic=DB.veiculos();
 const existentes=new Set(veic.map(v=>v.frota));
 let add=0;
 FROTA_IMPORTADA.forEach(function(r){
  if(existentes.has(r.frota))return;
  veic.push({frota:r.frota,placa:"",modelo:"",fabricante:"",marca:"",ano:null,km:r.km,
   filial:"",cidade:"",tipo:r.tipo,implemento:"Nenhum",capacidade:"",chassi:"",renavam:"",

   ultimaManut:r.ultimaManut,proximaManut:r.proximaManut,obsTec:r.obsTec,fotos:[],docs:[]});
  existentes.add(r.frota);add++;
 });
 DB.setVeiculos(veic);
 const L=DB.listas();
 const tv=(L.tipoVeic&&L.tipoVeic.length)?L.tipoVeic.slice():DEFAULT_LISTAS.tipoVeic.slice();
 ["Implemento","Escolta"].forEach(function(t){if(!tv.includes(t))tv.push(t);});
 L.tipoVeic=tv;DB.setListas(L);
 DB.log("importar","veiculo","","Importação da planilha de manutenção preventiva: "+add+" veículo(s) adicionado(s).");

}

  o.push({rot:d.toLocaleDateString("pt-BR",{month:"short"}).replace(".",""),q:sub.length,

function gPareto(dados){
 if(!dados.length)return gVazio();
 const tot=dados.reduce((s,d)=>s+d.v,0),mx=dados[0].v;
 let ac=0;const cum=dados.map(function(d){ac+=d.v;return ac/tot*100;});
 const n=Math.min(dados.length,8),bw=Math.max(28,Math.min(52,Math.floor(490/n)-12)),gp=12;
 const H=214,bs=H-36,tp=22,W=Math.max(510,20+n*(bw+gp));
 let b="",ln=[];
 for(let i=0;i<n;i++){const d=dados[i],x=14+i*(bw+gp),h=Math.max(3,(d.v/mx)*(bs-tp)),y=bs-h;
  const c=cum[i]<=80?"var(--cr)":"var(--in)";
  b+='<rect class="hoverable" x="'+x+'" y="'+y+'" width="'+bw+'" height="'+h+'" rx="5" fill="'+c+'" onmouseenter="tipPareto(event,\''+esc(d.k).replace(/'/g,"")+'\','+d.v+','+tot+','+Math.round(cum[i])+')" onmouseleave="tipOff()"><animate attributeName="height" from="0" to="'+h+'" dur=".5s" fill="freeze"/><animate attributeName="y" from="'+bs+'" to="'+y+'" dur=".5s" fill="freeze"/></rect>'+

  ln.push([x+bw/2,bs-(cum[i]/100)*(bs-tp)]);}

 const y80=bs-0.8*(bs-tp);
 return '<div style="overflow-x:auto"><svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'+
  '<line x1="14" y1="'+bs+'" x2="'+(W-14)+'" y2="'+bs+'" stroke="var(--bd)"/>'+

  '<span class="lgi"><span class="sw" style="background:var(--in)"></span>Cauda (20%)</span>'+
  '<span class="lgi"><span class="sw" style="background:var(--cy)"></span>Acumulado</span></div>';

function gDonut(dados,cores,fmt){
 if(!dados.length)return gVazio();
 // Só cabem 6 fatias. Antes o total somava TODOS os itens, então as fatias
 // não completavam o círculo e sobrava um vazio. Agora o excedente vira "Outros".
 let fatias=dados.slice(0,6);
 if(dados.length>6){
  const resto=dados.slice(5).reduce(function(s,d){return s+d.v;},0);
  fatias=dados.slice(0,5);
  if(resto>0)fatias=fatias.concat([{k:"Outros ("+(dados.length-5)+")",v:resto}]);
 }
 const tot=fatias.reduce(function(s,d){return s+d.v;},0);
 const R=62,r=40,cx=70,cy=70;let a0=-Math.PI/2,sg="";
 fatias.forEach(function(d,i){const an=(d.v/tot)*Math.PI*2,a1=a0+an,c=cores[i%cores.length];
  const x0=cx+R*Math.cos(a0),y0=cy+R*Math.sin(a0),x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1);
  const i1x=cx+r*Math.cos(a1),i1y=cy+r*Math.sin(a1),i0x=cx+r*Math.cos(a0),i0y=cy+r*Math.sin(a0);
  const bg=an>Math.PI?1:0;
  sg+='<path class="hoverable" d="M'+x0+','+y0+' A'+R+','+R+' 0 '+bg+' 1 '+x1+','+y1+' L'+i1x+','+i1y+' A'+r+','+r+' 0 '+bg+' 0 '+i0x+','+i0y+' Z" fill="'+c+'" onmouseenter="tipRank(event,\''+esc(d.k).replace(/'/g,"")+'\','+d.v+','+tot+','+(i+1)+','+fatias.length+','+(fmt?1:0)+')" onmouseleave="tipOff()"/>';
  a0=a1;});
 return '<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">'+
  '<svg width="140" height="140" viewBox="0 0 140 140">'+sg+
   '<text x="70" y="66" fill="var(--t1)" font-size="18" font-weight="800" text-anchor="middle">'+(fmt?fmt(tot):tot)+'</text>'+
   '<text x="70" y="83" fill="var(--t2)" font-size="9.5" text-anchor="middle">total</text></svg>'+
  '<div style="flex:1;min-width:140px;display:flex;flex-direction:column;gap:7px">'+
   fatias.map(function(d,i){return '<div style="display:flex;align-items:center;gap:8px;font-size:11.5px">'+
    '<span class="sw" style="background:'+cores[i%cores.length]+'"></span>'+
    '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(d.k)+'</span>'+
    '<b>'+(fmt?fmt(d.v):d.v)+'</b><span style="color:var(--t3);font-size:10.5px;width:32px;text-align:right">'+Math.round(d.v/tot*100)+'%</span></div>';}).join("")+
  '</div></div>';
}
function gGauge(pct,cor,lbl){

async function entrar(){
 const l=document.getElementById("lu").value.trim().toLowerCase(),p=document.getElementById("lp").value;
 const lmEl=document.getElementById("lm"),lembrar=!!(lmEl&&lmEl.checked);
 // ── Modo nuvem: autentica no Supabase ──
 // Só tenta a nuvem quando o acesso parece um e-mail. Assim o usuário local de
 // emergência (admin) continua funcionando mesmo com a nuvem configurada — o que
 // é essencial enquanto o banco ainda não estiver pronto.
 if(supaConfigurado()&&SUPA.client&&l.includes("@")){
  telaLoginCarregando();
  const {data,error}=await SUPA.client.auth.signInWithPassword({email:l,password:p});
  if(error)return telaLogin(error.message==="Invalid login credentials"
    ?"E-mail ou senha inválidos.":("Não foi possível entrar: "+error.message));
  const ok=await iniciarSessaoSupabase(data.user);
  if(!ok)return;
  try{
   if(lembrar)localStorage.setItem("sgfpro:lembrar","1");else localStorage.removeItem("sgfpro:lembrar");
  }catch(e){}
  DB.log("login","sessao",S.sessao.login,"Acesso ao sistema (nuvem)");
  S.view="executivo";render();
  setTimeout(function(){toast("Bem-vindo, "+S.sessao.nome.split(" ")[0],
    PERFIS[S.sessao.perfil].n+" · conectado ao Supabase","ok");},900);
  return;
 }
 // ── Modo local (offline, localStorage) ──
 const u=DB.usuarios().find(x=>x.login.toLowerCase()===l);
 if(!u)return telaLogin("Usuário ou senha inválidos.");
 const hash=await hashSenha(p);
 if(u.senha!==hash)return telaLogin("Usuário ou senha inválidos.");
 if(!u.ativo)return telaLogin("Usuário bloqueado. Procure o administrador.");
 S.sessao={id:u.id,login:u.login,nome:u.nome,perfil:u.perfil};
 try{
  if(lembrar){localStorage.setItem("sgfpro:sessao",JSON.stringify(S.sessao));sessionStorage.removeItem("sgfpro:sessao");}
  else{sessionStorage.setItem("sgfpro:sessao",JSON.stringify(S.sessao));localStorage.removeItem("sgfpro:sessao");}
 }catch(e){}
 DB.log("login","sessao",u.login,"Acesso ao sistema");DB.backupAuto();
 S.view="executivo";render();
 setTimeout(function(){toast("Bem-vindo, "+u.nome.split(" ")[0],PERFIS[u.perfil].n+" · acesso liberado","ok");},1150);
 const avisoImport=sessionStorage.getItem("sgfpro:aviso_import");
 if(avisoImport){sessionStorage.removeItem("sgfpro:aviso_import");
  setTimeout(function(){toast("Frota importada",avisoImport,"info");},2600);}
}
function sair(){if(S.sessao)DB.log("logout","sessao",S.sessao.login,"Saída do sistema");
 S.sessao=null;
 if(SUPA.client&&SUPA.ativo){try{SUPA.client.auth.signOut();}catch(e){}}
 SUPA.ativo=false;CACHE.veiculos=[];CACHE.falhas=[];CACHE.motoristas=[];CACHE.solicitacoes=[];CACHE.profiles=[];
 try{sessionStorage.removeItem("sgfpro:sessao");localStorage.removeItem("sgfpro:sessao");}catch(e){}telaLogin();}

/* Abre a sessão em modo nuvem: valida o perfil e traz os dados */
async function iniciarSessaoSupabase(user){
 const {data:prof,error}=await SUPA.client.from("profiles").select("*").eq("id",user.id).single();
 if(error||!prof){
  await SUPA.client.auth.signOut();
  telaLogin("Seu usuário existe no login, mas não tem perfil cadastrado. Procure o administrador.");
  return false;}
 if(prof.ativo===false){
  await SUPA.client.auth.signOut();
  telaLogin("Usuário bloqueado. Procure o administrador.");return false;}
 S.sessao={id:prof.id,login:prof.email||user.email,nome:prof.nome,perfil:prof.perfil};
 restaurarView();
 SUPA.ativo=true;
 const ok=await carregarDoSupabase();
 if(!ok){SUPA.ativo=false;
  telaLogin("Login aceito, mas os dados não puderam ser carregados. "+(SUPA.erro||"")+
   "  ·  Enquanto isso, você pode entrar em modo local com o usuário admin.");
  return false;}
 ligarRealtime();
 return true;
}

/* ═══ Campo de filtro combinado: digitação + lista rolante ═══ */
const _COMBO={};
function comboFiltro(campo,itens,vazio){
 const id="cb-"+campo;
 _COMBO[campo]=(itens||[]).filter(Boolean);
 const atual=S.F[campo]||"";
 return '<div class="cbx">'+
  '<input class="inp" id="'+id+'" value="'+esc(atual)+'" placeholder="'+esc(vazio||"Todos")+'" '+
   'autocomplete="off" onfocus="comboAbrir('+qid(campo)+')" '+
   'oninput="comboAbrir('+qid(campo)+',this.value)" '+
   'onkeydown="comboTecla(event,'+qid(campo)+')">'+
  '<button type="button" class="cbx-b" onclick="comboAlternar('+qid(campo)+')" '+
   'title="Ver todas as opções" tabindex="-1">'+mi("arrowDown")+'</button>'+
  '<div class="cbx-l" id="'+id+'-l"></div></div>';
}
function _norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
function comboAbrir(campo,txt){
 const l=document.getElementById("cb-"+campo+"-l");if(!l)return;
 const todas=_COMBO[campo]||[],q=_norm(txt||"");
 const lista=q?todas.filter(function(x){return _norm(x).indexOf(q)>=0;}):todas;
 const atual=S.F[campo]||"";
 l.innerHTML=(lista.length
  ? '<div'+(atual?"":' class="sel"')+' onclick="comboEscolher('+qid(campo)+',\'\')">Todos</div>'+
    lista.slice(0,300).map(function(x){
     return '<div'+(x===atual?' class="sel"':"")+' onclick="comboEscolher('+qid(campo)+','+qid(x)+')">'+esc(x)+'</div>';}).join("")
  : '<div class="vazio">Nenhuma opção encontrada</div>');
 l.classList.add("on");
 // fecha ao clicar fora
 if(!l._fora){l._fora=function(e){if(!l.parentNode.contains(e.target))comboFechar(campo);};
  setTimeout(function(){document.addEventListener("click",l._fora);},0);}
}
function comboFechar(campo){
 const l=document.getElementById("cb-"+campo+"-l");if(!l)return;
 l.classList.remove("on");
 if(l._fora){document.removeEventListener("click",l._fora);l._fora=null;}
}
function comboAlternar(campo){
 const l=document.getElementById("cb-"+campo+"-l");
 if(l&&l.classList.contains("on"))return comboFechar(campo);
 const i=document.getElementById("cb-"+campo);
 comboAbrir(campo);            // abre com a lista inteira
 if(i)i.focus();
}
function comboEscolher(campo,valor){
 const i=document.getElementById("cb-"+campo);
 if(i)i.value=valor;
 comboFechar(campo);
 setF(campo,valor);
}
function comboTecla(ev,campo){
 if(ev.key==="Escape")return comboFechar(campo);
 if(ev.key!=="Enter")return;
 ev.preventDefault();
 const l=document.getElementById("cb-"+campo+"-l");
 const op=l?l.querySelector("div:not(.vazio)"):null;   // primeira opção da lista
 const txt=(ev.target.value||"").trim();
 if(!txt)return comboEscolher(campo,"");
 // se o que sobrou na lista for uma única opção, escolhe ela
 const vis=l?[...l.querySelectorAll("div:not(.vazio)")].slice(1):[];
 if(vis.length===1)return comboEscolher(campo,vis[0].textContent);
 setFBusca(campo,txt);
 comboFechar(campo);
}

/* Item 49: a busca por texto não pode re-renderizar a tela a cada tecla — isso fazia o campo
   perder o foco e dava a impressão de que a página "reiniciava". Agora a digitação é livre e a
   lista só é recalculada após uma breve pausa, devolvendo o foco e o cursor ao campo. */
let _debTimer=null;
function _debRender(inputId){
 clearTimeout(_debTimer);
 _debTimer=setTimeout(function(){
  render();
  if(!inputId)return;
  const i=document.getElementById(inputId);
  if(i){i.focus();const n=i.value.length;try{i.setSelectionRange(n,n);}catch(e){}}
 },280);
}
function setFDeb(k,v,inputId){S.F[k]=v;zerarPag();_debRender(inputId);}

/* Recebe o que foi digitado no filtro pesquisável. Se o texto não bater com
   nenhuma opção conhecida, tenta casar ignorando maiúsculas e acentos. */
function setFBusca(campo,txt){
 txt=String(txt||"").trim();
 if(!txt)return setF(campo,"");
 const norm=function(s){return String(s||"").toLowerCase()
   .normalize("NFD").replace(/[\u0300-\u036f]/g,"");};
 const fal=DB.falhas();
 let opcoes=[];
 if(campo==="componente")opcoes=uniq([].concat.apply([],fal.map(function(r){
   return itensDe(r).map(function(i){return i.componente;});})));
 else if(campo==="sistema")opcoes=SIS;
 else if(campo==="modelo")opcoes=MOD;
 else if(campo==="fabricante")opcoes=FAB;
 else if(campo==="oficina")opcoes=OFIC;
 else opcoes=uniq(fal.map(function(r){return r[campo];}));
 const exato=opcoes.find(function(x){return norm(x)===norm(txt);});
 if(exato)return setF(campo,exato);
 const parcial=opcoes.filter(function(x){return norm(x).indexOf(norm(txt))>=0;});
 if(parcial.length===1)return setF(campo,parcial[0]);
 if(!parcial.length){
  toast("Sem correspondência","Nenhuma opção de "+campo+" contém \u201c"+txt+"\u201d.","aviso");
  return setF(campo,"");
 }
 setF(campo,txt);   // texto parcial: a lista abaixo mostra as opções
}

 if(k==="q"){const i=document.getElementById("fq");if(i){i.focus();i.setSelectionRange(v.length,v.length);}}}

/* ═══════════ FILTRO POR GRÁFICO ═══════════
   Cada gráfico pode ter o próprio recorte, aplicado SOBRE o filtro global da
   página. Assim dá para comparar visões diferentes sem perder o contexto geral. */
const CAMPOS_FG=[
 ["periodo","Período"],["frota","Frota"],["filial","Filial"],["sistema","Sistema"],
 ["componente","Componente"],["criticidade","Criticidade"],["status","Situação do RF"],
 ["tipoRF","Tipo de RF"],["oficina","Oficina"],["modelo","Modelo"]
];
function contarFG(chave){
 const f=S.FG[chave];if(!f)return 0;
 return Object.keys(f).filter(function(k){return f[k]&&f[k]!=="todos";}).length;
}
/* Aplica o recorte local sobre a lista já filtrada globalmente */
function filtrarG(chave,lista){
 const f=S.FG[chave];if(!f)return lista;
 const corte={todos:0,"7":7*DIA,"30":30*DIA,"90":90*DIA,"180":180*DIA,"365":365*DIA}[f.periodo]||0;
 const now=Date.now();
 return lista.filter(function(r){
  if(corte&&(now-r.registro)>corte)return false;
  for(let i=0;i<CAMPOS_FG.length;i++){
   const k=CAMPOS_FG[i][0];
   if(k==="periodo")continue;
   if(f[k]&&String(r[k]||"")!==String(f[k]))return false;
  }
  return true;
 });
}
function setFG(chave,campo,valor){
 S.FG[chave]=S.FG[chave]||{};
 if(!valor||valor==="todos")delete S.FG[chave][campo];
 else S.FG[chave][campo]=valor;
 if(!Object.keys(S.FG[chave]).length)delete S.FG[chave];
 render();
 // mantém o painel de filtro do gráfico aberto para ajustes seguidos
 if(document.getElementById("ov"))abrirFiltroG(chave);

/* ═══════════ PAGINAÇÃO ═══════════
   Tabelas grandes travam o navegador se renderizadas inteiras. Mostramos um
   lote por vez; os filtros continuam valendo sobre a lista completa. */
const POR_PAGINA=50;
function paginar(chave,lista){
 const total=Math.max(1,Math.ceil(lista.length/POR_PAGINA));
 const atual=Math.min(Math.max(1,S.pag[chave]||1),total);
 S.pag[chave]=atual;
 return{itens:lista.slice((atual-1)*POR_PAGINA,atual*POR_PAGINA),
  pag:atual,paginas:total,n:lista.length,
  de:lista.length?((atual-1)*POR_PAGINA+1):0,ate:Math.min(atual*POR_PAGINA,lista.length)};
}
function irPag(chave,p){S.pag[chave]=p;render();
 const t=document.querySelector(".wrap");
 if(t&&t.scrollIntoView)try{t.scrollIntoView({behavior:"smooth",block:"start"});}catch(e){}}
function barraPag(chave,r){
 if(r.n<=POR_PAGINA)return "";
 const b=function(rot,p,on,dis){
  return '<button '+(dis?"disabled":'onclick="irPag('+qid(chave)+','+p+')"')+(on?' class="on"':"")+'>'+rot+'</button>';};
 let nums="";
 const ini=Math.max(1,Math.min(r.pag-2,r.paginas-4)),fim=Math.min(r.paginas,ini+4);
 if(ini>1)nums+=b("1",1)+(ini>2?'<span class="pgn-i">…</span>':"");
 for(let p=ini;p<=fim;p++)nums+=b(String(p),p,p===r.pag);
 if(fim<r.paginas)nums+=(fim<r.paginas-1?'<span class="pgn-i">…</span>':"")+b(String(r.paginas),r.paginas);
 return '<div class="pgn"><span class="pgn-i">Mostrando <b>'+r.de+'–'+r.ate+'</b> de '+r.n+'</span>'+
  '<div class="pgn-b">'+b(mi("arrowLeft"),r.pag-1,false,r.pag<=1)+nums+
  b(mi("arrowRight"),r.pag+1,false,r.pag>=r.paginas)+'</div></div>';
}

function loteStatusFalha(st){

   liberacao:st==="liberada"?(r.liberacao||agora):null,
   hist:(r.hist||[]).concat([{ts:agora,usuario:usuario,campo:"Situação",

 });

function salvarObsVeic(frota){

function anexarVeic(frota){
 const inp=document.getElementById("v-arq");
 if(!inp)return;
 if(!inp.files.length)return alert("Selecione ao menos um arquivo.");
 const nomes=Array.prototype.slice.call(inp.files).map(f=>f.name);
 DB.setVeiculos(DB.veiculos().map(function(v){if(v.frota!==frota)return v;
  const fotos=(v.fotos||[]).slice(),docs=(v.docs||[]).slice();
  nomes.forEach(n=>{if(/\.(png|jpe?g|webp|gif)$/i.test(n))fotos.push(n);else docs.push(n);});
  return Object.assign({},v,{fotos:fotos,docs:docs});}));
 DB.log("anexar","veiculo",frota,nomes.join(", "));render();
}

   recebidas de motoristas. Hoje o atendimento é simulado (sem backend); a função
   salvarNovaSolicitacao() é o único ponto de entrada de novas solicitações — quando a
   API Oficial do WhatsApp Business, o Protheus, o Power BI ou uma automação (Excel/
   Google Sheets/REST) forem conectados, basta chamar essa mesma função. */
function filtrarSol(lista){
 const corte={todos:0,"7":7*DIA,"30":30*DIA,"90":90*DIA,"180":180*DIA,"365":365*DIA}[S.FS.periodo]||0,now=Date.now();
 const de=S.FS.dataDe?new Date(S.FS.dataDe+"T00:00:00").getTime():null;
 const ate=S.FS.dataAte?new Date(S.FS.dataAte+"T23:59:59").getTime():null;
 return lista.filter(function(r){
  if(corte&&(now-r.ts)>corte)return false;
  if(de!=null&&r.ts<de)return false;
  if(ate!=null&&r.ts>ate)return false;
  const ks=["frota","motorista","status","filial","prioridade"];
  for(let i=0;i<ks.length;i++){if(S.FS[ks[i]]&&r[ks[i]]!==S.FS[ks[i]])return false;}
  if(S.FS.q.trim()){const q=S.FS.q.toLowerCase();
   if(![r.numeroSol,r.frota,r.placa,r.motorista,r.localizacao,r.fornecedorSugerido,r.descricao].join(" ").toLowerCase().includes(q))return false;}
  return true;
 });
}

function salvarNovaSolicitacao(){
 const g=function(i){const e=document.getElementById(i);return e?e.value.trim():"";};
 let frota=g("ns-frota").toUpperCase();
 const motorista=g("ns-motorista"),descricao=g("ns-descricao");
 const local=g("ns-local"),forn=g("ns-fornecedor");
 if(!frota||!motorista||!descricao||!local||!forn)
  return alert("Preencha os campos obrigatórios: frota, motorista, descrição, localização e fornecedor.");
 // Vale em qualquer modo: sem frota válida a solicitação fica órfã.
 const rf=resolverFrota(frota);
 if(!rf.ok){
  if(rf.motivo==="ambigua")
   return alert('Existe mais de uma frota com o número "'+frota+'": '+rf.opcoes.join(", ")+
    '.\n\nDigite o número completo.');
  return alert('A frota "'+frota+'" não está cadastrada.\n\n'+
   'Confira o número (ex.: F-423) ou peça ao PCM para cadastrá-la antes de abrir a solicitação.');
 }
 frota=rf.frota;
 const _inpA=document.getElementById("ns-anexos");
 const arquivos=(_inpA&&_inpA.files)?Array.prototype.slice.call(_inpA.files):[];
 const anexos=arquivos.map(function(f){return{nome:f.name,tipo:tipoAnexo(f.type),tam:f.size};});
 const sols=DB.solicitacoes();
 const nova={id:Math.max.apply(null,[0].concat(sols.map(function(s){return Number(s.id)||0;})))+1,

  prioridade:g("ns-prioridade")||"media",observacoes:g("ns-obs"),status:"nova",motivoRejeicao:"",
  criadoPor:S.sessao?S.sessao.id:null,criadoPorNome:S.sessao?S.sessao.nome:"",
  analisadoEm:null,falhaId:null,anexos:anexos,origem:"app",
  hist:[{ts:Date.now(),usuario:S.sessao?S.sessao.nome:"—",acao:"criou",obs:"Solicitação registrada"}]};
 // No modo nuvem gravamos direto: precisamos do id para subir os arquivos.
 if(SUPA.ativo){
  const btn=document.getElementById("ns-enviar");
  if(btn){btn.disabled=true;btn.style.opacity=".65";btn.textContent=arquivos.length?"Enviando arquivos…":"Enviando…";}
  (async function(){
   try{
    const {data,error}=await SUPA.client.from("solicitacoes").insert(solToDB(nova)).select().single();
    if(error)throw error;
    if(arquivos.length)await enviarAnexos(data.id,arquivos,"solicitacao");
    await carregarDoSupabase();
    DB.log("criar","solicitacao",frota,"Solicitação aberta"+(arquivos.length?" com "+arquivos.length+" anexo(s)":""));
    fechar();render();
    toast("Solicitação enviada",
      arquivos.length?("O PCM foi notificado. "+arquivos.length+" arquivo(s) anexado(s)."):
      "O PCM foi notificado e vai analisar. Acompanhe por aqui.","ok");
   }catch(e){
    if(btn){btn.disabled=false;btn.style.opacity="1";btn.innerHTML=mi("check")+" Enviar Solicitação";}
    alert("Não foi possível enviar: "+(e.message||e));
   }
  })();
  return;
 }
 sols.unshift(nova);DB.setSolicitacoes(sols);
 DB.log("criar","solicitacao",frota,"Solicitação aberta — aguardando PCM");
 fechar();render();
 toast("Solicitação enviada",
  arquivos.length?"O PCM foi notificado. Os arquivos só são enviados de fato no modo nuvem.":
  "O PCM foi notificado e vai analisar. Acompanhe por aqui.","ok");
}

/* Anexa arquivos a uma solicitação já enviada */
function anexarNaSolicitacao(id){
 const s=achaSol(id);if(!s)return;
 if(!SUPA.ativo)return alert("O envio de arquivos funciona quando o sistema está conectado à nuvem.");
 const inp=document.createElement("input");
 inp.type="file";inp.multiple=true;
 inp.accept="image/*,video/*,audio/*,.pdf,.doc,.docx";
 inp.onchange=function(){
  const arquivos=Array.prototype.slice.call(inp.files||[]);
  if(!arquivos.length)return;
  toast("Enviando anexos",arquivos.length+" arquivo(s)…","info");
  enviarAnexos(s._uid,arquivos,"solicitacao")
   .then(function(){return carregarDoSupabase();})
   .then(function(){
    render();
    const atual=DB.solicitacoes().find(function(x){return String(x._uid)===String(s._uid);});
    if(atual)drawerSol(String(atual.id));
    toast("Anexos enviados",arquivos.length+" arquivo(s) salvos na solicitação.","ok");
   })
   .catch(function(e){alert("Não foi possível enviar: "+(e.message||e));});
 };
 inp.click();
}
function analisarSol(id,novoStatus){
 if(!pode("aprovar"))return;
 const s=achaSol(id);if(!s)return;
 let motivo="";
 if(novoStatus==="rejeitada"){
  motivo=prompt("Motivo da rejeição:");
  if(motivo===null)return;
  if(!motivo.trim())return alert("Informe o motivo da rejeição.");
 }
 if(novoStatus==="aguardando_info"){
  motivo=prompt("O que falta? (será enviado ao solicitante)");
  if(motivo===null)return;
 }
 const sols=DB.solicitacoes().map(function(x){
  if(String(x.id)!==String(id))return x;
  const h=(x.hist||[]).concat([{ts:Date.now(),usuario:S.sessao?S.sessao.nome:"—",
   acao:stSol(novoStatus).l,obs:motivo||""}]);
  return Object.assign({},x,{status:novoStatus,motivoRejeicao:novoStatus==="rejeitada"?motivo.trim():x.motivoRejeicao,
   analisadoEm:Date.now(),hist:h});});
 DB.setSolicitacoes(sols);
 DB.log("status","solicitacao",s.frota,"Solicitação "+(s.numeroSol||s.id)+" → "+stSol(novoStatus).l);
 fecharDrawer();render();
 toast("Solicitação atualizada",stSol(novoStatus).l+" · o solicitante foi notificado","ok");
}

/* Marca a solicitação como convertida depois que o RF é criado */
function concluirConversao(solId,novaFalha){
 const sol=DB.solicitacoes().find(function(x){return String(x.id)===String(solId);});
 // ── Nuvem: uma função do banco grava o vínculo, copia os anexos da solicitação
 //    para o RF e registra a timeline dos dois lados, tudo numa transação. ──
 if(SUPA.ativo&&sol&&sol._uid){
  Promise.resolve(DB._ultimaSync).then(function(){
   const rf=DB.falhas().find(function(x){return String(x.id)===String(novaFalha.id);})||novaFalha;
   if(!rf._uid)throw new Error("O registro de falha ainda não tinha sido gravado na nuvem.");
   return SUPA.client.rpc("vincular_solicitacao_rf",{p_solicitacao_id:sol._uid,p_rf_id:rf._uid});
  }).then(function(res){
   if(res&&res.error)throw res.error;
   return carregarDoSupabase();
  }).then(function(){
   render();
   toast("Solicitação convertida","Vínculo e anexos transferidos para o RF.","ok");
  }).catch(function(e){
   toast("Conversão incompleta",msgErroSupa(e)+" — o RF foi criado, mas a solicitação não foi vinculada.","erro");
  });
  return;
 }
 // ── Local ──
 const sols=DB.solicitacoes().map(function(x){
  if(String(x.id)!==String(solId))return x;
  return Object.assign({},x,{status:"convertida_rf",analisadoEm:Date.now(),
   falhaId:novaFalha?novaFalha.id:null,
   hist:(x.hist||[]).concat([{ts:Date.now(),usuario:S.sessao?S.sessao.nome:"—",
    acao:"Convertida em RF",obs:"Gerou o registro de falha"+(novaFalha?" #"+novaFalha.id:"")}])});});
 DB.setSolicitacoes(sols);
 DB.log("status","solicitacao",novaFalha?novaFalha.frota:"","Convertida em registro de falha");
}

function inicioSemana(offset){
 const d=new Date();d.setHours(0,0,0,0);
 d.setDate(d.getDate()-d.getDay()+1+(offset||0)*7);   // segunda-feira
 return d;
}
function filtrarTarefas(lista){
 const f=S.FP;
 return lista.filter(function(t){
  if(f.frota&&t.frota!==f.frota)return false;
  if(f.tipo&&t.tipo!==f.tipo)return false;
  if(f.status&&t.status!==f.status)return false;
  if(f.oficina&&t.oficina!==f.oficina)return false;
  if(f.sistema&&t.sistema!==f.sistema)return false;
  if(f.mdo&&(t.equipe||[]).indexOf(f.mdo)<0)return false;
  return true;
 });
}

let _arrastando=null;
function arrastarIni(ev,id){
 _arrastando=String(id);
 try{ev.dataTransfer.effectAllowed="move";ev.dataTransfer.setData("text/plain",String(id));}catch(e){}
 if(ev.target&&ev.target.classList)ev.target.classList.add("mov");
}
function arrastarFim(){
 _arrastando=null;
 [].slice.call(document.querySelectorAll(".agt.mov")).forEach(function(e){e.classList.remove("mov");});
 [].slice.call(document.querySelectorAll(".agc.alvo")).forEach(function(e){e.classList.remove("alvo");});
}
/* ── Toque: segurar move a tarefa (tablet não tem arrastar nativo) ── */
let _toque=null;
function toqueIni(ev,id){
 if(!ev.touches||!ev.touches.length)return;
 const alvo=ev.currentTarget;
 _toque={id:String(id),el:alvo,movendo:false,
  x:ev.touches[0].clientX,y:ev.touches[0].clientY,
  timer:setTimeout(function(){
   if(!_toque)return;
   _toque.movendo=true;
   alvo.classList.add("mov");
   if(navigator.vibrate)navigator.vibrate(30);
   toast("Modo mover","Arraste até o dia ou responsável e solte.","info");
  },450)};   // segurar por meio segundo entra no modo mover
}
function toqueMove(ev){
 if(!_toque||!ev.touches||!ev.touches.length)return;
 const t=ev.touches[0];
 if(!_toque.movendo){
  // ainda não segurou o bastante: se rolou a tela, desiste
  if(Math.abs(t.clientX-_toque.x)>12||Math.abs(t.clientY-_toque.y)>12){
   clearTimeout(_toque.timer);_toque=null;}
  return;
 }
 ev.preventDefault();   // impede a rolagem enquanto move
 [].slice.call(document.querySelectorAll(".agc.alvo")).forEach(function(e){e.classList.remove("alvo");});
 const sob=document.elementFromPoint(t.clientX,t.clientY);
 const cel=sob&&sob.closest?sob.closest(".agc"):null;
 if(cel)cel.classList.add("alvo");
}
function toqueFim(ev){
 if(!_toque)return;
 clearTimeout(_toque.timer);
 const info=_toque;_toque=null;
 info.el.classList.remove("mov");
 [].slice.call(document.querySelectorAll(".agc.alvo")).forEach(function(e){e.classList.remove("alvo");});
 if(!info.movendo)return;   // toque curto: deixa o clique abrir os detalhes
 const t=(ev.changedTouches&&ev.changedTouches[0])||null;
 if(!t)return;
 const sob=document.elementFromPoint(t.clientX,t.clientY);
 const cel=sob&&sob.closest?sob.closest(".agc"):null;
 if(!cel||!cel.dataset||!cel.dataset.dia)return;
 // mesma rota do arrastar com mouse
 soltarTarefa({preventDefault:function(){},currentTarget:cel,
   dataTransfer:{getData:function(){return info.id;}}},
  Number(cel.dataset.dia),cel.dataset.mdo||null);
}
function soltarTarefa(ev,diaMs,mdoId){
 ev.preventDefault();
 if(ev.currentTarget&&ev.currentTarget.classList)ev.currentTarget.classList.remove("alvo");
 let id=_arrastando;
 try{id=id||ev.dataTransfer.getData("text/plain");}catch(e){}
 if(!id)return;
 const tars=DB.tarefas();
 const i=tars.findIndex(function(x){return String(x.id)===String(id);});
 if(i<0)return;
 const t=tars[i];
 const dur=(t.fim-t.ini)||((t.horas||4)*3600000);
 const novo=new Date(diaMs);novo.setHours(8,0,0,0);
 const mesmoDia=new Date(t.ini).setHours(0,0,0,0)===new Date(diaMs).setHours(0,0,0,0);
 const equipeAtual=(t.equipe||[]);
 const mesmaEquipe=mdoId?equipeAtual.length===1&&equipeAtual[0]===mdoId:!equipeAtual.length;
 if(mesmoDia&&mesmaEquipe)return;        // nada mudou
 tars[i]=Object.assign({},t,{ini:novo.getTime(),fim:novo.getTime()+dur,
  equipe:mdoId?[mdoId]:[]});
 DB.setTarefas(tars);
 const nome=mdoId?(DB.maoDeObra().find(function(m){return m.id===mdoId;})||{}).nome:"sem responsável";
 DB.log("editar","tarefa",t.frota,t.titulo+" reprogramada para "+dOnly(novo.getTime())+" · "+nome);
 render();
 toast("Tarefa reprogramada",t.titulo+" → "+dOnly(novo.getTime())+" · "+nome,"ok");
}

 if(i<0)return;

 // Regra do PCM: tarefa com pendência aberta não fecha — reprograma.

 if(st==="concluida")n.concluidaEm=Date.now();

function salvarTarefa(id){

 let frota=g("t-frota").toUpperCase();

 if(!frota)return alert("Informe a frota.");

 if(!rf.ok){
  if(rf.motivo==="ambigua")return alert('Mais de uma frota com esse número: '+rf.opcoes.join(", ")+'.');
  return alert('A frota "'+frota+'" não está cadastrada.');
 }
 frota=rf.frota;
 if(!titulo)return alert("Informe o título da tarefa.");

 const tars=DB.tarefas();

  sistema:g("t-sis"),oficina:g("t-ofic"),local:g("t-local"),

  status:g("t-status")||"programada",prioridade:g("t-prio")||"media",
  obs:g("t-obs"),equipe:equipe};
 if(id){
  const i=tars.findIndex(function(x){return String(x.id)===String(id);});
  if(i>=0)tars[i]=Object.assign({},tars[i],dados);
  DB.log("editar","tarefa",frota+" · "+os,titulo);
 }else{

 }

  toast("Atenção: choque de agenda",nomes.join(", ")+" já tem outra tarefa neste horário.","aviso");

}

async function salvarUsuario(id){
 if(id==="null"||id===0||id==="0")id=null;
 const g=i=>document.getElementById(i).value.trim();
 const nome=g("u-nome"),login=g("u-login").toLowerCase(),senha=g("u-senha"),perfil=g("u-perfil");
 if(!nome||!login||(!id&&!senha))return alert("Preencha nome, "+(SUPA.ativo?"e-mail":"login")+" e senha.");

 // ── Modo nuvem: conta criada no Supabase Auth ──
 if(SUPA.ativo){
  const btn=(typeof event!=="undefined"&&event&&event.target)?event.target:null;
  if(btn){btn.disabled=true;btn.style.opacity=".6";btn.textContent="Salvando…";}
  try{
   if(id){
    const {error}=await SUPA.client.from("profiles").update({nome:nome}).eq("id",id);
    if(error)throw error;
    const atual=DB.usuarios().find(function(u){return String(u.id)===String(id);});
    if(atual&&atual.perfil!==perfil)await alterarPerfilNuvem(id,perfil);
    else await carregarDoSupabase();
    fechar();render();toast("Usuário atualizado",nome,"ok");
   }else{
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(login))throw new Error("Informe um e-mail válido.");
    if(senha.length<6)throw new Error("A senha precisa ter pelo menos 6 caracteres.");
    await criarUsuarioNuvem(nome,login,senha,perfil);
    fechar();render();
    toast("Usuário criado",nome+" · "+PERFIS[perfil].n+". Se a confirmação por e-mail estiver ativa no Supabase, ele precisa confirmar antes do primeiro acesso.","ok");
   }
  }catch(e){
   if(btn){btn.disabled=false;btn.style.opacity="1";btn.textContent="Salvar";}
   if((e.message||"")!=="__tratado__")alert("Não foi possível salvar: "+(e.message||e));
  }
  return;
 }
 let us=DB.usuarios();
 if(us.some(u=>u.login.toLowerCase()===login&&String(u.id)!==String(id)))return alert("Já existe um usuário com este login.");
 if(id){
  const atual=us.find(u=>String(u.id)===String(id));
  const senhaHash=senha?await hashSenha(senha):atual.senha;
  us=us.map(u=>String(u.id)===String(id)?Object.assign({},u,{nome:nome,login:login,senha:senhaHash,perfil:perfil}):u);
  DB.log("editar","usuario",login,"Dados alterados");}
 else{const senhaHash=await hashSenha(senha);
  us.push({id:Math.max.apply(null,[0].concat(us.map(u=>u.id)))+1,nome:nome,login:login,senha:senhaHash,perfil:perfil,ativo:true,criado:Date.now()});
  DB.log("criar","usuario",login,"Usuário criado com perfil "+PERFIS[perfil].n);}
 DB.setUsuarios(us);fechar();render();toast(id?"Usuário atualizado":"Usuário criado",nome,"ok");
}
async function bloquear(id){
 const u=DB.usuarios().find(x=>String(x.id)===String(id));
 if(!u)return;
 if(String(id)===String(S.sessao.id))return alert("Você não pode bloquear a si mesmo.");
 if(SUPA.ativo){
  try{
   await alterarStatusUsuarioNuvem(id,!u.ativo);
   render();toast(u.ativo?"Usuário bloqueado":"Usuário liberado",u.nome,u.ativo?"aviso":"ok");
  }catch(e){alert("Não foi possível alterar: "+(e.message||e));}
  return;
 }
 const us=DB.usuarios().map(x=>String(x.id)===String(id)?Object.assign({},x,{ativo:!x.ativo}):x);
 DB.setUsuarios(us);DB.log(u.ativo?"bloquear":"desbloquear","usuario",u.login,"");render();
}
async function excluirUsuario(id){
 const u=DB.usuarios().find(x=>String(x.id)===String(id));
 if(!u)return;
 if(String(id)===String(S.sessao.id))return alert("Você não pode excluir a si mesmo.");
 if(SUPA.ativo){
  if(!confirm('Remover o acesso de "'+u.nome+'"?\n\n'+
   'O usuário fica BLOQUEADO e não consegue mais entrar, mas continua na lista para você poder liberar depois.\n\n'+
   'Não apagamos o cadastro de vez porque a conta de login vive no Supabase Auth: apagar só o perfil deixaria uma conta órfã, '+
   'impossível de recadastrar pelo app. Para excluir em definitivo, remova o usuário em Authentication, no painel do Supabase.'))return;
  try{
   await alterarStatusUsuarioNuvem(id,false);
   render();
   toast("Acesso removido",u.nome+" está bloqueado. Use \u201cLiberar\u201d para devolver o acesso.","aviso");
  }catch(e){alert("Não foi possível remover: "+(e.message||e));}
  return;
 }
 if(!confirm("Excluir o usuário "+u.nome+"?"))return;
 DB.setUsuarios(DB.usuarios().filter(x=>String(x.id)!==String(id)));
 DB.log("excluir","usuario",u.login,"");render();
}
/* Envia e-mail de redefinição de senha (funciona com a chave pública) */
async function resetarSenha(id){
 const u=DB.usuarios().find(x=>String(x.id)===String(id));
 if(!u)return;
 if(!SUPA.ativo){
  const nova=prompt("Nova senha para "+u.nome+" (mínimo 6 caracteres):");
  if(nova===null)return;
  if(nova.length<6)return alert("A senha precisa ter pelo menos 6 caracteres.");
  const hash=await hashSenha(nova);
  DB.setUsuarios(DB.usuarios().map(x=>String(x.id)===String(id)?Object.assign({},x,{senha:hash}):x));
  DB.log("editar","usuario",u.login,"Senha redefinida pelo administrador");
  return toast("Senha alterada",u.nome,"ok");
 }
 if(!u.login||u.login.indexOf("@")<0)return alert("Este usuário não tem e-mail cadastrado.");
 if(!confirm("Enviar e-mail de redefinição de senha para "+u.login+"?"))return;
 try{
  const {error}=await SUPA.client.auth.resetPasswordForEmail(u.login,{redirectTo:window.location.href});
  if(error)throw error;
  toast("E-mail enviado",u.login+" vai receber o link para criar uma nova senha.","ok");
 }catch(e){alert("Não foi possível enviar: "+(e.message||e));}
}

    '</div></div>';}).join("")+'</div>'+
  (dica?'<div class="alert" style="margin-top:13px;border-color:'+mix(falhas.length?"var(--wr)":"var(--ok)",38)+
    ';background:'+mix(falhas.length?"var(--wr)":"var(--ok)",8)+'">'+

/* Sobe para a nuvem o que existir apenas neste navegador (frotas e RFs ainda sem id do banco) */
async function enviarLocalParaNuvem(){
 if(!SUPA.ativo)return;
 const locaisV=DB._r(DB._k.v,[]),locaisF=DB._r(DB._k.f,[]);
 const jaTem={};CACHE.veiculos.forEach(function(v){jaTem[v.frota]=1;});
 const novosV=locaisV.filter(function(v){return !jaTem[v.frota];});
 if(!novosV.length&&!locaisF.length)
  return toast("Nada a enviar","Não há dados locais fora da nuvem.","info");
 if(!confirm("Enviar "+novosV.length+" veículo(s) e "+locaisF.length+" registro(s) de falha deste navegador para a nuvem?"))return;
 try{
  if(novosV.length){
   const {error}=await SUPA.client.from("veiculos").insert(novosV.map(veicToDB));
   if(error)throw error;
  }
  await carregarDoSupabase();
  if(locaisF.length){
   const prontos=locaisF.filter(function(r){return CACHE.veiculos.some(function(v){return v.frota===r.frota;});});
   if(prontos.length){
    const {error}=await SUPA.client.from("registros_falha").insert(prontos.map(falhaToDB));
    if(error)throw error;
   }
  }
  await carregarDoSupabase();render();
  toast("Envio concluído","Os dados locais foram copiados para a nuvem.","ok");
 }catch(e){toast("Falha no envio",e.message||"erro desconhecido","erro");}
}

// falhas relacionadas a um ponto, para uma frota
function falhasDoPonto(frota,pt){
 return DB.falhas().filter(function(r){
  if(frota&&r.frota!==frota)return false;
  if(pt.comps.indexOf(r.componente)>=0)return true;
  // só cai no sistema se o componente não pertence a outro ponto mais específico
  if(pt.sis.indexOf(r.sistema)>=0){
   const outro=TOPVIEW.some(function(p){return p.id!==pt.id&&p.comps.indexOf(r.componente)>=0;});
   return !outro;
  }
  return false;});
}
function condicaoPonto(frota,pt){
 const rs=falhasDoPonto(frota,pt),now=Date.now();
 if(!rs.length)return "normal";
 const abertas=rs.filter(function(r){return ST[r.status].g==="aberta";});
 if(abertas.some(function(r){return r.severidade==="critica"||r.criticidade==="urgente";}))return "critica";
 // reincidência do mesmo componente = preventiva programada
 const cnt={};rs.forEach(function(r){cnt[r.componente]=(cnt[r.componente]||0)+1;});
 const reinc=Object.keys(cnt).some(function(k){return cnt[k]>=2;});
 const v=DB.veiculos().find(function(x){return x.frota===frota;});
 const prevVenc=v&&v.proximaManut&&v.proximaManut<now;
 if(abertas.length)return reinc?"preventiva":"atencao";
 if(reinc||prevVenc)return "preventiva";
 const rec90=rs.filter(function(r){return now-r.registro<=90*DIA;}).length;
 return rec90>=2?"atencao":"normal";
}

/* ═══════════ TOOLTIP GLOBAL ═══════════ */
function gtip(ev,html){
 let t=document.getElementById("gtip");
 if(!t){t=document.createElement("div");t.id="gtip";document.body.appendChild(t);}
 t.innerHTML=html;t.className="on";
 const mv=function(e){
  const r=t.getBoundingClientRect();
  let x=e.clientX+16,y=e.clientY-10;
  if(x+r.width>window.innerWidth-12)x=e.clientX-r.width-16;
  if(y+r.height>window.innerHeight-12)y=window.innerHeight-r.height-12;
  if(y<8)y=8;
  t.style.left=x+"px";t.style.top=y+"px";};
 mv(ev);
 if(t._mv)document.removeEventListener("mousemove",t._mv);
 t._mv=mv;document.addEventListener("mousemove",mv);
}
function tipOff(){const t=document.getElementById("gtip");if(!t)return;
 t.className="";if(t._mv){document.removeEventListener("mousemove",t._mv);t._mv=null;}}
/* tooltip padrão de série: valor, %, comparação, tendência */
function tipSerie(ev,titulo,valor,total,anterior,desc,fmt){
 fmt=fmt||function(v){return v;};
 const pct=total?Math.round(valor/total*100):null;
 let comp="";
 if(anterior!=null){
  const d=valor-anterior;
  const pc=anterior?Math.round(d/anterior*100):(valor?100:0);
  const up=d>0,igual=d===0;
  const cor=igual?"var(--t2)":(up?"var(--cr)":"var(--ok)");
  const seta=igual?mi("arrowRight"):(up?mi("arrowUp"):mi("arrowDown"));
  comp='<div class="gt-r"><span>Período anterior</span><b>'+fmt(anterior)+'</b></div>'+
   '<div class="gt-r"><span>Variação</span><b style="color:'+cor+'">'+seta+' '+(d>0?"+":"")+fmt(d)+(anterior?" ("+(pc>0?"+":"")+pc+"%)":"")+'</b></div>'+
   '<div class="gt-r"><span>Tendência</span><b style="color:'+cor+'">'+(igual?"Estável":(up?"Em crescimento":"Em redução"))+'</b></div>';
 }
 gtip(ev,'<div class="gt-t">'+esc(titulo)+'</div>'+
  '<div class="gt-r"><span>Valor</span><b>'+fmt(valor)+'</b></div>'+
  (pct!=null?'<div class="gt-r"><span>Participação</span><b>'+pct+'% do total</b></div>':"")+
  comp+(desc?'<div class="gt-d">'+esc(desc)+'</div>':""));
}

/* ═══════════ IDENTIFICAÇÃO DA FROTA ═══════════
   O usuário digita "423", "f423", "F 423" ou até a placa. Antes isso criava
   uma frota fantasma e o registro ficava órfão. Agora resolvemos para a frota
   real do cadastro — e, se não existir, o sistema avisa em vez de inventar. */
/* Detecta frotas duplicadas pelo número — o sintoma do problema acima.
   Ex.: "423" criada por engano convivendo com a real "F-423". */
function frotasDuplicadas(){
 const grupos={};
 DB.veiculos().forEach(function(v){
  const d=String(v.frota).replace(/\D/g,"");
  if(d)(grupos[d]=grupos[d]||[]).push(v);
 });
 const fal=DB.falhas(),sol=DB.solicitacoes();
 return Object.keys(grupos).filter(function(d){return grupos[d].length>1;}).map(function(d){
  return{num:d,itens:grupos[d].map(function(v){
   return{frota:v.frota,
    rfs:fal.filter(function(r){return String(r.frota)===String(v.frota);}).length,
    sols:sol.filter(function(s){return String(s.frota)===String(v.frota);}).length,
    completo:!!(v.placa||v.modelo||v.km)};})};
 });
}
/* Transfere tudo de uma frota para outra e remove a duplicada */
function mesclarFrotas(de,para){
 if(!pode("editar"))return;
 const nRF=DB.falhas().filter(function(r){return String(r.frota)===String(de);}).length;
 const nSol=DB.solicitacoes().filter(function(s){return String(s.frota)===String(de);}).length;
 if(!confirm('Mover tudo de "'+de+'" para "'+para+'"?\n\n'+
   nRF+' registro(s) de falha e '+nSol+' solicitação(ões) serão transferidos.\n'+
   'A frota "'+de+'" será removida do cadastro.\n\nEsta ação não pode ser desfeita.'))return;
 if(nRF)DB.setFalhas(DB.falhas().map(function(r){
  return String(r.frota)===String(de)?Object.assign({},r,{frota:para}):r;}));
 if(nSol)DB.setSolicitacoes(DB.solicitacoes().map(function(s){
  return String(s.frota)===String(de)?Object.assign({},s,{frota:para}):s;}));
 DB.setVeiculos(DB.veiculos().filter(function(v){return String(v.frota)!==String(de);}));
 DB.log("editar","veiculo",para,"Frota duplicada \""+de+"\" mesclada ("+nRF+" RF, "+nSol+" solicitação)");
 fechar();render();
 toast("Frotas unificadas",nRF+" RF e "+nSol+" solicitação(ões) movidos para "+para+".","ok");
}

function resolverFrota(txt){
 const veic=DB.veiculos();
 const bruto=String(txt||"").trim().toUpperCase();
 if(!bruto)return{ok:false,motivo:"vazia"};
 // 1) igual ao cadastro
 let m=veic.find(function(v){return String(v.frota).toUpperCase()===bruto;});
 if(m)return{ok:true,frota:m.frota};
 // 2) mesmos dígitos: "423" encontra "F-423"
 const dig=bruto.replace(/\D/g,"");
 if(dig){
  const cand=veic.filter(function(v){return String(v.frota).replace(/\D/g,"")===dig;});
  if(cand.length===1)return{ok:true,frota:cand[0].frota,corrigido:true};
  if(cand.length>1)return{ok:false,motivo:"ambigua",opcoes:cand.map(function(v){return v.frota;})};
 }
 // 3) digitou a placa
 const so=function(s){return String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"");};
 m=veic.find(function(v){return v.placa&&so(v.placa)===so(bruto);});
 if(m)return{ok:true,frota:m.frota,porPlaca:true};
 return{ok:false,motivo:"inexistente",digitado:bruto};
}
/* Confere o campo e mostra o retorno logo abaixo dele */
function conferirFrota(idCampo,idAviso){
 const inp=document.getElementById(idCampo),av=document.getElementById(idAviso);
 if(!inp||!av)return;
 const txt=inp.value.trim();
 if(!txt){av.innerHTML="";return;}
 const r=resolverFrota(txt);
 if(r.ok){
  inp.value=r.frota;   // normaliza o que ficou gravado
  const v=DB.veiculos().find(function(x){return x.frota===r.frota;})||{};
  const extra=[v.placa,v.modelo].filter(Boolean).join(" · ");
  av.innerHTML='<span style="color:var(--ok);display:inline-flex;align-items:center;gap:5px">'+mi("check")+
   (r.corrigido||r.porPlaca?"Identificado como <b>"+esc(r.frota)+"</b>":"<b>"+esc(r.frota)+"</b>")+
   (extra?' <span style="color:var(--t3)">'+esc(extra)+'</span>':"")+'</span>';
 }else if(r.motivo==="ambigua"){
  av.innerHTML='<span style="color:var(--wr);display:inline-flex;align-items:center;gap:5px">'+mi("warning")+
   'Mais de uma frota com esse número: <b>'+r.opcoes.map(esc).join(", ")+'</b>. Digite completo.</span>';
 }else{
  av.innerHTML='<span style="color:var(--cr);display:inline-flex;align-items:center;gap:5px">'+mi("close")+
   'Frota <b>'+esc(r.digitado||txt)+'</b> não existe no cadastro.</span>';
 }
}

 if(atual&&opAtual&&opAtual.disabled)sel.value="";

 severidade:"Severidade",criticidade:"Criticidade",prioridade:"Prioridade",status:"Situação",
