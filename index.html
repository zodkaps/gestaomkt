/* ═══ CAMADA PREMIUM ═══ */
html{scroll-behavior:smooth}
body{background-image:radial-gradient(1200px 600px at 85% -10%,var(--acs),transparent 70%);background-attachment:fixed}
.card,.pn{box-shadow:var(--sh);position:relative}
.card::before,.pn::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
 background:linear-gradient(180deg,rgba(255,255,255,.045),transparent 42%);opacity:.9}
:root[data-theme="light"] .card::before,:root[data-theme="light"] .pn::before{background:linear-gradient(180deg,rgba(255,255,255,.9),transparent 46%)}
.card{transition:transform .22s cubic-bezier(.16,1,.3,1),box-shadow .22s,border-color .22s}
.card:hover{transform:translateY(-3px);box-shadow:var(--sh2),var(--glow)}
.kpi .kv{background:linear-gradient(180deg,var(--t1),color-mix(in srgb,var(--t1) 72%,transparent));-webkit-background-clip:text;background-clip:text}
.kico{box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 22%,transparent)}
.b1{box-shadow:0 2px 10px color-mix(in srgb,var(--ac) 34%,transparent),inset 0 1px 0 rgba(255,255,255,.18)}
.b1:active,.b2:active{transform:translateY(1px) scale(.99)}
.b2,.b3,.ni,.tb,.rk,.gsx{transition:all .18s cubic-bezier(.16,1,.3,1)}
.ni.on{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ac) 26%,transparent)}
tbody tr{transition:background .16s,box-shadow .16s}
tbody tr:hover{box-shadow:inset 3px 0 0 var(--ac)}
.inp{transition:border-color .18s,box-shadow .18s,background .18s}
.tag{transition:transform .15s}
.pn .pt{letter-spacing:-.2px}

/* Skeleton loading */
@keyframes shimmer{0%{background-position:-460px 0}100%{background-position:460px 0}}
.skl{background:linear-gradient(90deg,var(--s3) 8%,var(--s4) 18%,var(--s3) 33%);
 background-size:920px 100%;animation:shimmer 1.15s linear infinite;border-radius:8px}
.skl-kpi{height:104px;border-radius:14px}
.skl-line{height:13px;margin-bottom:9px}
.skl-chart{height:196px;border-radius:12px}

/* Toasts */
#toasts{position:fixed;right:18px;bottom:18px;z-index:400;display:flex;flex-direction:column;gap:9px;pointer-events:none}
.toast{background:var(--s1);border:1px solid var(--bd);border-left:3px solid var(--ac);border-radius:11px;
 padding:11px 15px;box-shadow:var(--sh2);min-width:250px;max-width:360px;display:flex;gap:10px;align-items:flex-start;
 animation:tin .32s cubic-bezier(.16,1,.3,1);pointer-events:auto}
.toast.out{animation:tout .28s ease forwards}
@keyframes tin{from{opacity:0;transform:translateX(28px) scale(.97)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateX(28px) scale(.97)}}
.toast .tt{font-size:12.5px;font-weight:700;margin-bottom:2px}
.toast .td{font-size:11.5px;color:var(--t2);line-height:1.45}

/* Tooltip de gráfico */
#gtip{position:fixed;z-index:500;background:var(--s1);border:1px solid var(--bd2);border-radius:11px;
 padding:10px 13px;box-shadow:var(--sh2);font-size:12px;pointer-events:none;opacity:0;transition:opacity .13s;
 max-width:270px;line-height:1.5}
#gtip.on{opacity:1}

.hoverable{cursor:pointer;transition:opacity .15s,filter .15s}
.hoverable:hover{filter:brightness(1.16)}
.dimmed{opacity:.24}

/* Legenda clicável */
.lgi{cursor:pointer;user-select:none;padding:2px 6px;border-radius:6px;transition:.15s}
.lgi:hover{background:var(--s3)}
.lgi.off{opacity:.38;text-decoration:line-through}

/* Vista superior do caminhão */
.tvwrap{background:
  linear-gradient(var(--bd) 1px,transparent 1px) 0 0/28px 28px,

 background-blend-mode:normal;border:1px solid var(--bd);border-radius:14px;padding:18px;position:relative;overflow:hidden}

@keyframes ping{0%{r:9;opacity:.85}70%{r:22;opacity:0}100%{r:22;opacity:0}}
.pingc{animation:ping 1.9s ease-out infinite}
.cond-chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:20px;border:1px solid}

/* Splash */
#splash{position:fixed;inset:0;z-index:900;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;transition:opacity .45s ease,visibility .45s}

@keyframes drawin{from{stroke-dashoffset:340}to{stroke-dashoffset:0}}

.spbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));animation:barfill 1.05s cubic-bezier(.5,0,.2,1) forwards}

@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
/* ═══ RESPONSIVIDADE ═══ */

}
@media(max-width:420px){.kpis{grid-template-columns:1fr 1fr}}
</style>

async function criarUsuarioNuvem(nome,email,senha,perfil){
 if(!window.supabase||!window.supabase.createClient)throw new Error("Biblioteca do Supabase indisponível.");
 const tmp=window.supabase.createClient(SUPA.url,SUPA.key,
   {auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:"sb-tmp-"+Date.now()}});
 const {data,error}=await tmp.auth.signUp({email:email,password:senha,options:{data:{nome:nome}}});
 if(error){
  if(/already registered|already exists|User already|duplicate/i.test(error.message||"")){
   modalContaOrfa(nome,email,perfil);
   throw new Error("__tratado__");
  }
  throw error;
 }
 if(!data||!data.user)throw new Error("O cadastro não retornou o usuário.");
 // Dá um instante para o gatilho criar o profile
 await new Promise(function(r){setTimeout(r,600);});
 const {error:e2}=await SUPA.client.from("profiles").update({nome:nome}).eq("id",data.user.id);
 if(e2)throw new Error("Conta criada, mas o nome não pôde ser gravado: "+e2.message);
 if(perfil&&perfil!=="solicitante"){
  const {error:e3}=await SUPA.client.rpc("definir_perfil_usuario",{p_usuario_id:data.user.id,p_perfil:perfil});
  if(e3)throw new Error("Conta criada como Solicitante, mas o perfil não pôde ser alterado: "+e3.message);
 }
 await carregarDoSupabase();
 return data.user;
}

/* ─── Carga inicial: traz tudo para o cache ─── */
async function carregarDoSupabase(){
 if(!SUPA.client)return false;
 SUPA.carregando=true;SUPA.erro=null;
 try{
  const [rv,rf,rm,rs,rp]=await Promise.all([
   SUPA.client.from("veiculos").select("*").order("frota"),
   SUPA.client.from("registros_falha").select("*, veiculos(frota,placa,modelo,marca,filial,cidade)").order("ocorrido_em",{ascending:false}),
   SUPA.client.from("motoristas").select("*").order("nome"),
   SUPA.client.from("solicitacoes").select("*, veiculos(frota,placa,filial)").order("created_at",{ascending:false}),
   SUPA.client.from("profiles").select("*")
  ]);
  const err=[rv,rf,rm,rs,rp].map(function(r){return r.error;}).filter(Boolean)[0];
  if(err)throw err;
  CACHE.veiculos=(rv.data||[]).map(veicFromDB);
  CACHE.falhas=(rf.data||[]).map(falhaFromDB);
  CACHE.motoristas=(rm.data||[]).map(motFromDB);
  CACHE.solicitacoes=(rs.data||[]).map(solFromDB);
  CACHE.profiles=(rp.data||[]).map(function(p){
   return{id:p.id,_uid:p.id,login:p.email||"",nome:p.nome,perfil:p.perfil,ativo:p.ativo!==false,criado:_isoMs(p.created_at)};});
  marcarSincronizado("veiculos",CACHE.veiculos,veicToDB);
  marcarSincronizado("falhas",CACHE.falhas,falhaToDB);
  marcarSincronizado("motoristas",CACHE.motoristas,motToDB);
  marcarSincronizado("solicitacoes",CACHE.solicitacoes,solToDB);
  SUPA.ultimaSync=Date.now();SUPA.carregando=false;
  return true;
 }catch(e){
  SUPA.carregando=false;
  const m=(e&&e.message)?e.message:"Falha ao carregar dados do Supabase.";
  SUPA.erro=/does not exist|schema cache|relation/i.test(m)
   ? "As tabelas ainda não existem no banco. Rode os scripts SQL (01 a 05) no SQL Editor do Supabase. Detalhe: "+m
   : m;
  return false;
 }
}

/* ─── Sincronização: compara a lista nova com o cache e envia as diferenças ─── */
async function sincronizar(tabela,chaveCache,novaLista,paraDB){
 if(!SUPA.ativo||!SUPA.client)return;
 const base=SYNCED[chaveCache]||{};
 const inserir=[],atualizar=[],vistos={};
 (novaLista||[]).forEach(function(item){
  if(item._uid){
   vistos[item._uid]=1;
   const antes=base[item._uid],agora=JSON.stringify(paraDB(item));
   if(antes===undefined||antes!==agora)atualizar.push(item);
  }else inserir.push(item);
 });
 const remover=Object.keys(base).filter(function(u){return !vistos[u];});
 if(!inserir.length&&!atualizar.length&&!remover.length)return;

 SUPA.pendentes++;
 try{
  for(let i=0;i<inserir.length;i++){
   const {data,error}=await SUPA.client.from(tabela).insert(paraDB(inserir[i])).select().single();
   if(error)throw error;
   inserir[i]._uid=data.id;                       // guarda o id do banco no objeto local
   if(data.numero)inserir[i].id=data.numero;
  }
  for(let i=0;i<atualizar.length;i++){
   const {error}=await SUPA.client.from(tabela).update(paraDB(atualizar[i])).eq("id",atualizar[i]._uid);
   if(error)throw error;
  }
  for(let i=0;i<remover.length;i++){
   const {error}=await SUPA.client.from(tabela).delete().eq("id",remover[i]);
   if(error)throw error;
  }
  marcarSincronizado(chaveCache,novaLista,paraDB);
  SUPA.ultimaSync=Date.now();
 }catch(e){
  const msg=(e&&e.message)?e.message:"erro desconhecido";
  if(typeof toast==="function")
   toast("Falha ao gravar na nuvem",msg+" — a alteração ficou salva apenas neste navegador.","erro");
 }finally{
  SUPA.pendentes--;
  if(typeof render==="function"&&SUPA.pendentes===0)render();
 }
}

/* ─── Tempo real: outra pessoa alterou algo → recarrega ─── */
let _realtimeOn=false;
function ligarRealtime(){
 if(!SUPA.client||_realtimeOn)return;
 try{
  SUPA.client.channel("mkt-sync")
   .on("postgres_changes",{event:"*",schema:"public",table:"registros_falha"},agendarRecarga)
   .on("postgres_changes",{event:"*",schema:"public",table:"solicitacoes"},agendarRecarga)
   .on("postgres_changes",{event:"*",schema:"public",table:"veiculos"},agendarRecarga)
   .subscribe();
  _realtimeOn=true;
 }catch(e){/* sem tempo real não é crítico */}
}
let _recargaTimer=null;
function agendarRecarga(){
 if(SUPA.pendentes>0)return;               // não atropela uma gravação em andamento
 clearTimeout(_recargaTimer);
 _recargaTimer=setTimeout(async function(){
  if(await carregarDoSupabase()&&typeof render==="function")render();
 },900);
}

async function recarregarSupabase(){
 if(!SUPA.ativo)return;
 const ok=await carregarDoSupabase();
 render();
 toast(ok?"Dados atualizados":"Não foi possível atualizar",
   ok?"Sincronizado com o Supabase agora.":(SUPA.erro||""),ok?"ok":"erro");
}

function importarFrotaPlanilha(){
 if(localStorage.getItem("sgfpro:import_frota_v1"))return;
 const veic=DB.veiculos();
 const existentes=new Set(veic.map(v=>v.frota));
 let add=0;
 FROTA_IMPORTADA.forEach(function(r){
  if(existentes.has(r.frota))return;
  veic.push({frota:r.frota,placa:"",modelo:"",fabricante:"",marca:"",ano:null,km:r.km,
   filial:"",cidade:"",tipo:r.tipo,implemento:"Nenhum",capacidade:"",chassi:"",renavam:"",
   horimetro:0,statusVeic:"operando",aquisicao:null,
   ultimaManut:r.ultimaManut,proximaManut:r.proximaManut,obsTec:r.obsTec,fotos:[],docs:[]});
  existentes.add(r.frota);add++;
 });
 DB.setVeiculos(veic);
 const L=DB.listas();
 const tv=(L.tipoVeic&&L.tipoVeic.length)?L.tipoVeic.slice():DEFAULT_LISTAS.tipoVeic.slice();
 ["Implemento","Escolta"].forEach(function(t){if(!tv.includes(t))tv.push(t);});
 L.tipoVeic=tv;DB.setListas(L);
 DB.log("importar","veiculo","","Importação da planilha de manutenção preventiva: "+add+" veículo(s) adicionado(s).");
 localStorage.setItem("sgfpro:import_frota_v1","1");
 if(add>0)sessionStorage.setItem("sgfpro:aviso_import",add+" veículo(s) importado(s) da planilha de manutenção preventiva — complete placa, modelo e demais dados em Frotas.");
}
async function semear(){
 if(localStorage.getItem("sgfpro:seed"))return;
 const N=Date.now();
 const KM_TROCA={Pneus:60000,Lonas:40000,Pastilhas:35000,Baterias:80000,Embreagem:150000,"Óleo":10000};
 const comps=COMP_CATALOGO.map(function(c,i){
  const nome=c[0],sis=c[1];
  return {id:i+1,codigo:"CP-"+String(101+i),nome:nome,sistema:sis,fabricante:"",
   vidaUtil:"",kmTroca:KM_TROCA[nome]||"",criticidade:(nome==="Motor"||nome==="Freios"||nome.indexOf("freio")>=0||nome==="Direção")?"alta":"media",obs:""};
 });
 DB.setVeiculos([]);DB.setFalhas([]);DB.setMotoristas([]);DB.setComponentes(comps);DB.setSolicitacoes([]);
 DB.setListas(JSON.parse(JSON.stringify(DEFAULT_LISTAS)));
 const senhaHash=await hashSenha("Makro@2026");
 DB.setUsuarios([{id:1,login:"admin",senha:senhaHash,nome:"Administrador do Sistema",perfil:"admin",ativo:true,criado:N}]);
 localStorage.setItem("sgfpro:seed","1");
}

function filtrar(lista){
 const corte={todos:0,"7":7*DIA,"30":30*DIA,"90":90*DIA,"180":180*DIA,"365":365*DIA}[S.F.periodo]||0,now=Date.now();
 const de=S.F.dataDe?new Date(S.F.dataDe+"T00:00:00").getTime():null;
 const ate=S.F.dataAte?new Date(S.F.dataAte+"T23:59:59").getTime():null;
 return lista.filter(function(r){
  if(corte&&(now-r.registro)>corte)return false;
  if(de!=null&&r.registro<de)return false;
  if(ate!=null&&r.registro>ate)return false;
  const ks=["frota","placa","motorista","oficina","fornecedor","sistema","status","modelo","fabricante","cidade","filial","criticidade","severidade"];
  for(let i=0;i<ks.length;i++){if(S.F[ks[i]]&&r[ks[i]]!==S.F[ks[i]])return false;}
  if(S.F.q.trim()){const q=S.F.q.toLowerCase();
   if(![r.frota,r.placa,r.motorista,r.sistema,r.componente,r.descricao,r.sintoma,r.causa,r.local,r.oficina,r.responsavel,r.obs].join(" ").toLowerCase().includes(q))return false;}
  return true;
 });
}
function agrupar(base,campo){const m={};base.forEach(r=>{const k=r[campo]||"—";m[k]=(m[k]||0)+1;});
 return Object.entries(m).map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v);}
function somaPor(base,campo,val){const m={};base.forEach(r=>{const k=r[campo]||"—";m[k]=(m[k]||0)+(r[val]||0);});
 return Object.entries(m).map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v);}
function rankFrotas(base){
 const m={};
 base.forEach(function(r){if(!m[r.frota])m[r.frota]={frota:r.frota,placa:r.placa,modelo:r.modelo,total:0,crit:0,custo:0,sis:{}};
  const o=m[r.frota];o.total++;o.custo+=r.custo||0;
  if(r.severidade==="critica"||r.criticidade==="urgente")o.crit++;
  o.sis[r.sistema]=(o.sis[r.sistema]||0)+1;});

function mtbfGlobal(base){const p={};base.forEach(r=>{(p[r.frota]=p[r.frota]||[]).push(r.registro);});

  const f=new Date(d.getFullYear(),d.getMonth()+1,1).getTime();

function tendencia(sr){if(sr.length<4)return{d:"estavel",p:0};

function reincidencias(base){const m={};
 base.forEach(function(r){const k=r.frota+"|"+r.componente;

function correlacoes(base){const pares={},porF={};
 base.forEach(r=>{(porF[r.frota]=porF[r.frota]||[]).push(r);});

 }).sort((a,b)=>b.score-a.score);
}

function histComponente(nome){

function gDonut(dados,cores,fmt){
 if(!dados.length)return gVazio();
 const tot=dados.reduce((s,d)=>s+d.v,0);
 const R=62,r=40,cx=70,cy=70;let a0=-Math.PI/2,sg="";
 dados.slice(0,6).forEach(function(d,i){const an=(d.v/tot)*Math.PI*2,a1=a0+an,c=cores[i%cores.length];
  const x0=cx+R*Math.cos(a0),y0=cy+R*Math.sin(a0),x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1);
  const i1x=cx+r*Math.cos(a1),i1y=cy+r*Math.sin(a1),i0x=cx+r*Math.cos(a0),i0y=cy+r*Math.sin(a0);
  const bg=an>Math.PI?1:0;
  sg+='<path class="hoverable" d="M'+x0+','+y0+' A'+R+','+R+' 0 '+bg+' 1 '+x1+','+y1+' L'+i1x+','+i1y+' A'+r+','+r+' 0 '+bg+' 0 '+i0x+','+i0y+' Z" fill="'+c+'" onmouseenter="tipRank(event,\''+esc(d.k).replace(/'/g,"")+'\','+d.v+','+tot+','+(i+1)+','+Math.min(dados.length,6)+','+(fmt?1:0)+')" onmouseleave="tipOff()"/>';
  a0=a1;});
 return '<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">'+
  '<svg width="140" height="140" viewBox="0 0 140 140">'+sg+
   '<text x="70" y="66" fill="var(--t1)" font-size="18" font-weight="800" text-anchor="middle">'+(fmt?fmt(tot):tot)+'</text>'+
   '<text x="70" y="83" fill="var(--t2)" font-size="9.5" text-anchor="middle">total</text></svg>'+
  '<div style="flex:1;min-width:140px;display:flex;flex-direction:column;gap:7px">'+
   dados.slice(0,6).map(function(d,i){return '<div style="display:flex;align-items:center;gap:8px;font-size:11.5px">'+
    '<span class="sw" style="background:'+cores[i%cores.length]+'"></span>'+

  '</div></div>';
}
function gGauge(pct,cor,lbl){

async function entrar(){
 const l=document.getElementById("lu").value.trim().toLowerCase(),p=document.getElementById("lp").value;
 const lmEl=document.getElementById("lm"),lembrar=!!(lmEl&&lmEl.checked);
 // ── Modo nuvem: autentica no Supabase ──
 // Só tenta a nuvem quando o acesso parece um e-mail. Assim o usuário local de
 // emergência (admin) continua funcionando mesmo com a nuvem configurada — o que
 // é essencial enquanto o banco ainda não estiver pronto.
 if(supaConfigurado()&&SUPA.client&&l.includes("@")){
  telaLoginCarregando();
  const {data,error}=await SUPA.client.auth.signInWithPassword({email:l,password:p});
  if(error)return telaLogin(error.message==="Invalid login credentials"
    ?"E-mail ou senha inválidos.":("Não foi possível entrar: "+error.message));
  const ok=await iniciarSessaoSupabase(data.user);
  if(!ok)return;
  try{
   if(lembrar)localStorage.setItem("sgfpro:lembrar","1");else localStorage.removeItem("sgfpro:lembrar");
  }catch(e){}
  DB.log("login","sessao",S.sessao.login,"Acesso ao sistema (nuvem)");
  S.view="executivo";render();
  setTimeout(function(){toast("Bem-vindo, "+S.sessao.nome.split(" ")[0],
    PERFIS[S.sessao.perfil].n+" · conectado ao Supabase","ok");},900);
  return;
 }
 // ── Modo local (offline, localStorage) ──
 const u=DB.usuarios().find(x=>x.login.toLowerCase()===l);
 if(!u)return telaLogin("Usuário ou senha inválidos.");
 const hash=await hashSenha(p);
 if(u.senha!==hash)return telaLogin("Usuário ou senha inválidos.");
 if(!u.ativo)return telaLogin("Usuário bloqueado. Procure o administrador.");
 S.sessao={id:u.id,login:u.login,nome:u.nome,perfil:u.perfil};
 try{
  if(lembrar){localStorage.setItem("sgfpro:sessao",JSON.stringify(S.sessao));sessionStorage.removeItem("sgfpro:sessao");}
  else{sessionStorage.setItem("sgfpro:sessao",JSON.stringify(S.sessao));localStorage.removeItem("sgfpro:sessao");}
 }catch(e){}
 DB.log("login","sessao",u.login,"Acesso ao sistema");DB.backupAuto();
 S.view="executivo";render();
 setTimeout(function(){toast("Bem-vindo, "+u.nome.split(" ")[0],PERFIS[u.perfil].n+" · acesso liberado","ok");},1150);
 const avisoImport=sessionStorage.getItem("sgfpro:aviso_import");
 if(avisoImport){sessionStorage.removeItem("sgfpro:aviso_import");
  setTimeout(function(){toast("Frota importada",avisoImport,"info");},2600);}
}
function sair(){if(S.sessao)DB.log("logout","sessao",S.sessao.login,"Saída do sistema");
 S.sessao=null;
 if(SUPA.client&&SUPA.ativo){try{SUPA.client.auth.signOut();}catch(e){}}
 SUPA.ativo=false;CACHE.veiculos=[];CACHE.falhas=[];CACHE.motoristas=[];CACHE.solicitacoes=[];CACHE.profiles=[];
 try{sessionStorage.removeItem("sgfpro:sessao");localStorage.removeItem("sgfpro:sessao");}catch(e){}telaLogin();}

/* Abre a sessão em modo nuvem: valida o perfil e traz os dados */
async function iniciarSessaoSupabase(user){
 const {data:prof,error}=await SUPA.client.from("profiles").select("*").eq("id",user.id).single();
 if(error||!prof){
  await SUPA.client.auth.signOut();
  telaLogin("Seu usuário existe no login, mas não tem perfil cadastrado. Procure o administrador.");
  return false;}
 if(prof.ativo===false){
  await SUPA.client.auth.signOut();
  telaLogin("Usuário bloqueado. Procure o administrador.");return false;}
 S.sessao={id:prof.id,login:prof.email||user.email,nome:prof.nome,perfil:prof.perfil};
 SUPA.ativo=true;
 const ok=await carregarDoSupabase();
 if(!ok){SUPA.ativo=false;
  telaLogin("Login aceito, mas os dados não puderam ser carregados. "+(SUPA.erro||"")+
   "  ·  Enquanto isso, você pode entrar em modo local com o usuário admin.");
  return false;}
 ligarRealtime();
 return true;
}

 const b=document.querySelector(".lgc .b1");

}

/* Item 49: a busca por texto não pode re-renderizar a tela a cada tecla — isso fazia o campo
   perder o foco e dava a impressão de que a página "reiniciava". Agora a digitação é livre e a
   lista só é recalculada após uma breve pausa, devolvendo o foco e o cursor ao campo. */
let _debTimer=null;
function _debRender(inputId){
 clearTimeout(_debTimer);
 _debTimer=setTimeout(function(){
  render();
  if(!inputId)return;
  const i=document.getElementById(inputId);
  if(i){i.focus();const n=i.value.length;try{i.setSelectionRange(n,n);}catch(e){}}
 },280);
}
function setFDeb(k,v,inputId){S.F[k]=v;_debRender(inputId);}
function setFSDeb(k,v,inputId){S.FS[k]=v;_debRender(inputId);}
function setF(k,v){S.F[k]=v;render();
 if(k==="q"){const i=document.getElementById("fq");if(i){i.focus();i.setSelectionRange(v.length,v.length);}}}
function limparF(){Object.keys(S.F).forEach(k=>S.F[k]=k==="periodo"?"todos":"");render();}
function filtrarFrota(f){S.F.frota=f;S.frotaAtiva=f;S.view="frotas";window.scrollTo(0,0);render();}

  '<div class="kico" style="background:'+mix(k.c,14)+';color:'+k.c+(k.p?';animation:pulse 1.6s infinite':"")+'">'+k.i+'</div>'+
  '<div class="kv" style="color:var(--t1)'+(k.sm?';font-size:17px':"")+'">'+k.v+'</div>'+
  '<div class="kl">'+k.l+'</div><div class="ks">'+k.s+'</div></div>';}).join("")+'</div>';}

/* Arquitetura modular: este módulo concentra tudo relacionado a solicitações
   recebidas de motoristas. Hoje o atendimento é simulado (sem backend); a função
   salvarNovaSolicitacao() é o único ponto de entrada de novas solicitações — quando a
   API Oficial do WhatsApp Business, o Protheus, o Power BI ou uma automação (Excel/
   Google Sheets/REST) forem conectados, basta chamar essa mesma função. */
function filtrarSol(lista){
 const corte={todos:0,"7":7*DIA,"30":30*DIA,"90":90*DIA,"180":180*DIA,"365":365*DIA}[S.FS.periodo]||0,now=Date.now();
 const de=S.FS.dataDe?new Date(S.FS.dataDe+"T00:00:00").getTime():null;
 const ate=S.FS.dataAte?new Date(S.FS.dataAte+"T23:59:59").getTime():null;
 return lista.filter(function(r){
  if(corte&&(now-r.ts)>corte)return false;
  if(de!=null&&r.ts<de)return false;
  if(ate!=null&&r.ts>ate)return false;
  const ks=["frota","motorista","status","filial","prioridade"];
  for(let i=0;i<ks.length;i++){if(S.FS[ks[i]]&&r[ks[i]]!==S.FS[ks[i]])return false;}
  if(S.FS.q.trim()){const q=S.FS.q.toLowerCase();
   if(![r.numeroSol,r.frota,r.placa,r.motorista,r.localizacao,r.fornecedorSugerido,r.descricao].join(" ").toLowerCase().includes(q))return false;}
  return true;
 });
}

function analisarSol(id,novoStatus){
 if(!pode("aprovar"))return;
 const s=achaSol(id);if(!s)return;
 let motivo="";
 if(novoStatus==="rejeitada"){
  motivo=prompt("Motivo da rejeição:");
  if(motivo===null)return;
  if(!motivo.trim())return alert("Informe o motivo da rejeição.");
 }
 if(novoStatus==="aguardando_info"){
  motivo=prompt("O que falta? (será enviado ao solicitante)");
  if(motivo===null)return;
 }
 const sols=DB.solicitacoes().map(function(x){
  if(String(x.id)!==String(id))return x;
  const h=(x.hist||[]).concat([{ts:Date.now(),usuario:S.sessao?S.sessao.nome:"—",
   acao:stSol(novoStatus).l,obs:motivo||""}]);
  return Object.assign({},x,{status:novoStatus,motivoRejeicao:novoStatus==="rejeitada"?motivo.trim():x.motivoRejeicao,
   analisadoEm:Date.now(),hist:h});});
 DB.setSolicitacoes(sols);
 DB.log("status","solicitacao",s.frota,"Solicitação "+(s.numeroSol||s.id)+" → "+stSol(novoStatus).l);
 fecharDrawer();render();
 toast("Solicitação atualizada",stSol(novoStatus).l+" · o solicitante foi notificado","ok");
}

async function confirmarConversao(id){

  responsavel:S.sessao?S.sessao.nome:"",dataPrev:null,

 fal.unshift(nova);DB.setFalhas(fal);
 const sols=DB.solicitacoes().map(function(x){

   hist:(x.hist||[]).concat([{ts:Date.now(),usuario:S.sessao?S.sessao.nome:"—",

 DB.log("criar","falha",s.frota+" · "+sistema,"Convertido da solicitação "+(s.numeroSol||s.id));
 fechar();render();
 toast("Convertida em RF","Registro de falha #"+nova.id+" criado.","ok");

async function salvarUsuario(id){
 if(id==="null"||id===0||id==="0")id=null;
 const g=i=>document.getElementById(i).value.trim();
 const nome=g("u-nome"),login=g("u-login").toLowerCase(),senha=g("u-senha"),perfil=g("u-perfil");
 if(!nome||!login||(!id&&!senha))return alert("Preencha nome, "+(SUPA.ativo?"e-mail":"login")+" e senha.");

 // ── Modo nuvem: conta criada no Supabase Auth ──
 if(SUPA.ativo){
  const btn=(typeof event!=="undefined"&&event&&event.target)?event.target:null;
  if(btn){btn.disabled=true;btn.style.opacity=".6";btn.textContent="Salvando…";}
  try{
   if(id){
    const {error}=await SUPA.client.from("profiles").update({nome:nome}).eq("id",id);
    if(error)throw error;
    const atual=DB.usuarios().find(function(u){return String(u.id)===String(id);});
    if(atual&&atual.perfil!==perfil)await alterarPerfilNuvem(id,perfil);
    else await carregarDoSupabase();
    fechar();render();toast("Usuário atualizado",nome,"ok");
   }else{
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(login))throw new Error("Informe um e-mail válido.");
    if(senha.length<6)throw new Error("A senha precisa ter pelo menos 6 caracteres.");
    await criarUsuarioNuvem(nome,login,senha,perfil);
    fechar();render();
    toast("Usuário criado",nome+" · "+PERFIS[perfil].n+". Se a confirmação por e-mail estiver ativa no Supabase, ele precisa confirmar antes do primeiro acesso.","ok");
   }
  }catch(e){
   if(btn){btn.disabled=false;btn.style.opacity="1";btn.textContent="Salvar";}
   if((e.message||"")!=="__tratado__")alert("Não foi possível salvar: "+(e.message||e));
  }
  return;
 }
 let us=DB.usuarios();
 if(us.some(u=>u.login.toLowerCase()===login&&String(u.id)!==String(id)))return alert("Já existe um usuário com este login.");
 if(id){
  const atual=us.find(u=>String(u.id)===String(id));
  const senhaHash=senha?await hashSenha(senha):atual.senha;
  us=us.map(u=>String(u.id)===String(id)?Object.assign({},u,{nome:nome,login:login,senha:senhaHash,perfil:perfil}):u);
  DB.log("editar","usuario",login,"Dados alterados");}
 else{const senhaHash=await hashSenha(senha);
  us.push({id:Math.max.apply(null,[0].concat(us.map(u=>u.id)))+1,nome:nome,login:login,senha:senhaHash,perfil:perfil,ativo:true,criado:Date.now()});
  DB.log("criar","usuario",login,"Usuário criado com perfil "+PERFIS[perfil].n);}
 DB.setUsuarios(us);fechar();render();toast(id?"Usuário atualizado":"Usuário criado",nome,"ok");
}
async function bloquear(id){
 const u=DB.usuarios().find(x=>String(x.id)===String(id));
 if(!u)return;
 if(String(id)===String(S.sessao.id))return alert("Você não pode bloquear a si mesmo.");
 if(SUPA.ativo){
  try{
   await alterarStatusUsuarioNuvem(id,!u.ativo);
   render();toast(u.ativo?"Usuário bloqueado":"Usuário liberado",u.nome,u.ativo?"aviso":"ok");
  }catch(e){alert("Não foi possível alterar: "+(e.message||e));}
  return;
 }
 const us=DB.usuarios().map(x=>String(x.id)===String(id)?Object.assign({},x,{ativo:!x.ativo}):x);
 DB.setUsuarios(us);DB.log(u.ativo?"bloquear":"desbloquear","usuario",u.login,"");render();
}
async function excluirUsuario(id){

 if(!u)return;
 if(String(id)===String(S.sessao.id))return alert("Você não pode excluir a si mesmo.");
 if(SUPA.ativo){

   'O usuário fica BLOQUEADO e não consegue mais entrar, mas continua na lista para você poder liberar depois.\n\n'+

/* Envia e-mail de redefinição de senha (funciona com a chave pública) */
async function resetarSenha(id){
 const u=DB.usuarios().find(x=>String(x.id)===String(id));
 if(!u)return;
 if(!SUPA.ativo){
  const nova=prompt("Nova senha para "+u.nome+" (mínimo 6 caracteres):");
  if(nova===null)return;
  if(nova.length<6)return alert("A senha precisa ter pelo menos 6 caracteres.");
  const hash=await hashSenha(nova);
  DB.setUsuarios(DB.usuarios().map(x=>String(x.id)===String(id)?Object.assign({},x,{senha:hash}):x));
  DB.log("editar","usuario",u.login,"Senha redefinida pelo administrador");
  return toast("Senha alterada",u.nome,"ok");
 }
 if(!u.login||u.login.indexOf("@")<0)return alert("Este usuário não tem e-mail cadastrado.");
 if(!confirm("Enviar e-mail de redefinição de senha para "+u.login+"?"))return;
 try{
  const {error}=await SUPA.client.auth.resetPasswordForEmail(u.login,{redirectTo:window.location.href});
  if(error)throw error;
  toast("E-mail enviado",u.login+" vai receber o link para criar uma nova senha.","ok");
 }catch(e){alert("Não foi possível enviar: "+(e.message||e));}
}

/* Sobe para a nuvem o que existir apenas neste navegador (frotas e RFs ainda sem id do banco) */
async function enviarLocalParaNuvem(){
 if(!SUPA.ativo)return;
 const locaisV=DB._r(DB._k.v,[]),locaisF=DB._r(DB._k.f,[]);
 const jaTem={};CACHE.veiculos.forEach(function(v){jaTem[v.frota]=1;});
 const novosV=locaisV.filter(function(v){return !jaTem[v.frota];});
 if(!novosV.length&&!locaisF.length)
  return toast("Nada a enviar","Não há dados locais fora da nuvem.","info");
 if(!confirm("Enviar "+novosV.length+" veículo(s) e "+locaisF.length+" registro(s) de falha deste navegador para a nuvem?"))return;
 try{
  if(novosV.length){
   const {error}=await SUPA.client.from("veiculos").insert(novosV.map(veicToDB));
   if(error)throw error;
  }
  await carregarDoSupabase();
  if(locaisF.length){
   const prontos=locaisF.filter(function(r){return CACHE.veiculos.some(function(v){return v.frota===r.frota;});});
   if(prontos.length){
    const {error}=await SUPA.client.from("registros_falha").insert(prontos.map(falhaToDB));
    if(error)throw error;
   }
  }
  await carregarDoSupabase();render();
  toast("Envio concluído","Os dados locais foram copiados para a nuvem.","ok");
 }catch(e){toast("Falha no envio",e.message||"erro desconhecido","erro");}
}

function backupManual(){

  "backup_sgf_"+new Date().toISOString().slice(0,10)+".json");
 DB.log("exportar","backup","","Backup completo baixado");
}
function modalRestaurar(){
 abrir('<div class="md" style="max-width:460px"><div class="ph"><div><div class="pt">Restaurar backup</div>'+
  '<div class="ps">Os dados atuais serão substituídos</div></div><button class="b3" onclick="fechar()">'+mi('close')+'</button></div>'+
  '<input class="inp" type="file" id="rst-f" accept=".json" style="padding:8px">'+
  '<div style="display:flex;gap:9px;margin-top:16px;justify-content:flex-end"><button class="b2" onclick="fechar()">Cancelar</button>'+
  '<button class="b1" onclick="processarRestauro()">Restaurar</button></div></div>');
}
function processarRestauro(){
 const f=document.getElementById("rst-f").files[0];
 if(!f)return alert("Selecione o arquivo de backup.");
 if(!confirm("Isso substituirá todos os dados atuais. Continuar?"))return;
 const r=new FileReader();
 r.onload=function(e){try{const o=JSON.parse(e.target.result);
  if(DB.importarTudo(o)){DB.log("restaurar","backup","",f.name);fechar();render();alert("Backup restaurado com sucesso.");}
  else alert("Arquivo de backup inválido.");}catch(err){alert("Não foi possível ler o arquivo.");}};
 r.readAsText(f);
}
function restaurarBk(dia){
 if(!confirm("Restaurar o backup de "+dia+"? Os dados atuais serão substituídos."))return;
 if(DB.restaurar(dia)){DB.log("restaurar","backup",dia,"Backup automático");render();alert("Backup restaurado.");}
 else alert("Não foi possível restaurar este backup.");
}

function vCaminhoes(){
 const veic=DB.veiculos(),fal=DB.falhas();
 let lista=veic.slice();
 // Busca prioriza o número da frota (item 56), depois placa/modelo/fabricante/chassi
 if(S.F.q.trim()){const q=S.F.q.toLowerCase();
  lista=lista.filter(v=>[v.frota,v.placa,v.modelo,v.marca,v.fabricante,v.chassi,v.renavam].join(" ").toLowerCase().indexOf(q)>=0);
  lista.sort(function(a,b){
   const pa=String(a.frota||"").toLowerCase().indexOf(q)>=0?0:1;
   const pb=String(b.frota||"").toLowerCase().indexOf(q)>=0?0:1;
   return pa!==pb?pa-pb:String(a.frota).localeCompare(String(b.frota));});}
 else lista.sort((a,b)=>String(a.frota).localeCompare(String(b.frota)));
 if(S.F.filial)lista=lista.filter(v=>v.filial===S.F.filial);
 let nLivre=0,nManut=0,nParado=0;
 veic.forEach(function(v){const k=v.statusVeic||"operando";
  if(k==="parado")nParado++;else if(STVEIC[k]&&STVEIC[k].livre)nLivre++;else nManut++;});
 const K=[
  {i:mi("truck"),c:"var(--in)",v:veic.length,l:"Caminhões",s:"na frota"},
  {i:"●",c:"var(--ok)",v:nLivre,l:"Disponíveis",s:"em operação"},
  {i:"◔",c:"var(--wr)",v:nManut,l:"Em manutenção",s:"oficina / aguardando"},
  {i:"■",c:"var(--cr)",v:nParado,l:"Parados",s:"indisponíveis"},
 ];
 return '<div class="pg fu"><div><div class="pgt">Cadastro de Caminhões</div>'+
  '<div class="pgs">Frota completa · cada caminhão tem página própria com histórico, custos e indicadores</div></div>'+
  (pode("criar")?'<button class="b1" onclick="modalVeiculo()">'+mi('plus')+' Novo caminhão</button>':'')+'</div>'+
  blocoFiltrosSimples(["filial"])+cardsKPI(K)+
  '<div class="pn fu"><div class="ph"><div><div class="pt">'+mi('truck')+' Frota cadastrada</div>'+
   '<div class="ps">'+lista.length+' caminhã(o/es) · clique para abrir a página completa</div></div></div>'+
   '<div class="tw"><table><thead><tr><th>Frota</th><th>Placa</th><th>Marca/Modelo</th><th>Ano</th><th>Tipo</th>'+
   '<th>Implemento</th><th>KM</th><th>Filial</th><th>Falhas</th><th>Status</th></tr></thead><tbody>'+
   (lista.length?lista.map(function(v){
    const nf=fal.filter(r=>r.frota===v.frota).length;
    const sv=STVEIC[v.statusVeic||"operando"]||STVEIC.operando;
    return '<tr onclick="abrirFrota(\''+esc(v.frota)+'\')">'+
     '<td><b>'+esc(v.frota)+'</b></td><td style="font-family:monospace">'+(esc(v.placa)||"—")+'</td>'+
     '<td style="color:var(--t2)">'+esc((v.marca||v.fabricante||"")+" "+(v.modelo||"")).trim()+'</td>'+
     '<td style="color:var(--t2)">'+(v.ano||"—")+'</td><td style="color:var(--t2)">'+esc(v.tipo||"—")+'</td>'+
     '<td style="color:var(--t2)">'+esc(v.implemento||"—")+'</td>'+
     '<td style="color:var(--t2)">'+(v.km||0).toLocaleString("pt-BR")+'</td>'+
     '<td style="color:var(--t2)">'+esc(v.filial||"—")+'</td>'+
     '<td><b>'+nf+'</b></td>'+
     '<td><span class="tag" style="background:'+mix(sv.c,14)+';color:'+sv.c+'">'+sv.i+' '+sv.l+'</span></td></tr>';}).join(""):'<tr><td colspan="10" style="text-align:center;padding:34px;color:var(--t2)">Nenhum caminhão encontrado.</td></tr>')+
   '</tbody></table></div></div>';
}

function salvarMotorista(id){
 if(id==="null"||id===0||id==="0")id=null;
 const g=i=>{const e=document.getElementById(i);return e?e.value.trim():"";};
 const nome=g("m-nome"),matricula=g("m-matricula");
 if(!nome||!matricula)return alert("Preencha nome e matrícula.");
 let ms=DB.motoristas();
 if(ms.some(x=>x.matricula.toLowerCase()===matricula.toLowerCase()&&String(x.id)!==String(id)))return alert("Já existe motorista com esta matrícula.");
 const val=g("m-val")?new Date(g("m-val")).getTime():null;
 const dados={nome:nome,matricula:matricula,cpf:g("m-cpf"),cnh:g("m-cnh"),catCnh:g("m-cat"),
  validadeCnh:val,filial:g("m-filial"),telefone:g("m-tel"),ativo:g("m-ativo")==="1",obs:g("m-obs")};
 if(id){ms=ms.map(x=>String(x.id)===String(id)?Object.assign({},x,dados):x);DB.log("editar","motorista",nome,"Cadastro atualizado");}
 else{ms.push(Object.assign({id:Math.max.apply(null,[0].concat(ms.map(x=>x.id)))+1},dados));DB.log("criar","motorista",nome,"Motorista cadastrado");}
 DB.setMotoristas(ms);fechar();render();toast(id?"Motorista atualizado":"Motorista cadastrado",nome,"ok");
}

function salvarComponente(nomeOrig){
 const g=i=>{const e=document.getElementById(i);return e?e.value.trim():"";};
 const nome=g("c-nome");
 if(!nome)return alert("Preencha o nome do componente.");
 let cs=DB.componentes();
 if(!nomeOrig&&cs.some(x=>x.nome.toLowerCase()===nome.toLowerCase()))return alert("Já existe um componente com este nome.");
 const dados={codigo:g("c-cod"),nome:nome,sistema:g("c-sis"),fabricante:g("c-fab"),
  vidaUtil:g("c-vida"),kmTroca:g("c-km")?parseInt(g("c-km")):"",criticidade:g("c-cri"),obs:g("c-obs")};
 if(nomeOrig){cs=cs.map(x=>x.nome===nomeOrig?Object.assign({},x,dados):x);DB.log("editar","componente",nome,"Cadastro atualizado");}
 else{cs.push(Object.assign({id:Math.max.apply(null,[0].concat(cs.map(x=>x.id||0)))+1},dados));DB.log("criar","componente",nome,"Componente cadastrado");}
 DB.setComponentes(cs);toast(nomeOrig?"Componente atualizado":"Componente cadastrado",nome,"ok");fechar();
 if(nomeOrig&&nomeOrig!==nome&&S.compAtivo===nomeOrig)S.compAtivo=nome;
 render();
}

 DB.setComponentes(DB.componentes().filter(x=>x.nome!==nome));DB.log("excluir","componente",nome,"");
 S.compAtivo=null;fechar();render();}

/* ═══════════ NOTIFICAÇÕES ═══════════ */
function toast(titulo,texto,tipo){
 let c=document.getElementById("toasts");
 if(!c){c=document.createElement("div");c.id="toasts";document.body.appendChild(c);}
 const cores={ok:"var(--ok)",erro:"var(--cr)",aviso:"var(--wr)",info:"var(--ac)"};
 const ic={ok:mi("check"),erro:"!",aviso:"▲",info:"i"};
 const t=document.createElement("div");t.className="toast";
 t.style.borderLeftColor=cores[tipo||"info"];

// falhas relacionadas a um ponto, para uma frota
function falhasDoPonto(frota,pt){
 return DB.falhas().filter(function(r){
  if(frota&&r.frota!==frota)return false;
  if(pt.comps.indexOf(r.componente)>=0)return true;
  // só cai no sistema se o componente não pertence a outro ponto mais específico
  if(pt.sis.indexOf(r.sistema)>=0){
   const outro=TOPVIEW.some(function(p){return p.id!==pt.id&&p.comps.indexOf(r.componente)>=0;});
   return !outro;
  }
  return false;});
}
function condicaoPonto(frota,pt){
 const rs=falhasDoPonto(frota,pt),now=Date.now();
 if(!rs.length)return "normal";
 const abertas=rs.filter(function(r){return ST[r.status].g==="aberta";});
 if(abertas.some(function(r){return r.severidade==="critica"||r.criticidade==="urgente";}))return "critica";
 // reincidência do mesmo componente = preventiva programada
 const cnt={};rs.forEach(function(r){cnt[r.componente]=(cnt[r.componente]||0)+1;});
 const reinc=Object.keys(cnt).some(function(k){return cnt[k]>=2;});
 const v=DB.veiculos().find(function(x){return x.frota===frota;});
 const prevVenc=v&&v.proximaManut&&v.proximaManut<now;
 if(abertas.length)return reinc?"preventiva":"atencao";
 if(reinc||prevVenc)return "preventiva";
 const rec90=rs.filter(function(r){return now-r.registro<=90*DIA;}).length;
 return rec90>=2?"atencao":"normal";
}

/* ═══════════ TOOLTIP GLOBAL ═══════════ */
function gtip(ev,html){
 let t=document.getElementById("gtip");
 if(!t){t=document.createElement("div");t.id="gtip";document.body.appendChild(t);}
 t.innerHTML=html;t.className="on";
 const mv=function(e){
  const r=t.getBoundingClientRect();
  let x=e.clientX+16,y=e.clientY-10;
  if(x+r.width>window.innerWidth-12)x=e.clientX-r.width-16;
  if(y+r.height>window.innerHeight-12)y=window.innerHeight-r.height-12;
  if(y<8)y=8;
  t.style.left=x+"px";t.style.top=y+"px";};
 mv(ev);
 if(t._mv)document.removeEventListener("mousemove",t._mv);
 t._mv=mv;document.addEventListener("mousemove",mv);
}
function tipOff(){const t=document.getElementById("gtip");if(!t)return;
 t.className="";if(t._mv){document.removeEventListener("mousemove",t._mv);t._mv=null;}}

function tipSerie(ev,titulo,valor,total,anterior,desc,fmt){
 fmt=fmt||function(v){return v;};
 const pct=total?Math.round(valor/total*100):null;
 let comp="";
 if(anterior!=null){
  const d=valor-anterior;
  const pc=anterior?Math.round(d/anterior*100):(valor?100:0);
  const up=d>0,igual=d===0;
  const cor=igual?"var(--t2)":(up?"var(--cr)":"var(--ok)");
  const seta=igual?mi("arrowRight"):(up?mi("arrowUp"):mi("arrowDown"));
  comp='<div class="gt-r"><span>Período anterior</span><b>'+fmt(anterior)+'</b></div>'+
   '<div class="gt-r"><span>Variação</span><b style="color:'+cor+'">'+seta+' '+(d>0?"+":"")+fmt(d)+(anterior?" ("+(pc>0?"+":"")+pc+"%)":"")+'</b></div>'+
   '<div class="gt-r"><span>Tendência</span><b style="color:'+cor+'">'+(igual?"Estável":(up?"Em crescimento":"Em redução"))+'</b></div>';
 }
 gtip(ev,'<div class="gt-t">'+esc(titulo)+'</div>'+
  '<div class="gt-r"><span>Valor</span><b>'+fmt(valor)+'</b></div>'+
  (pct!=null?'<div class="gt-r"><span>Participação</span><b>'+pct+'% do total</b></div>':"")+
  comp+(desc?'<div class="gt-d">'+esc(desc)+'</div>':""));
}

  descricao:descricao,sintoma:g("x-sintoma"),causa:g("x-causa"),
  severidade:g("x-severidade"),criticidade:g("x-criticidade"),prioridade:g("x-prioridade"),
  status:status,statusOp:statusOp,responsavel:g("x-responsavel"),
  dataPrev:g("x-dataprev")?new Date(g("x-dataprev")+"T00:00:00").getTime():null,

  obs:g("x-obs"),registro:ts};
 let fal=DB.falhas();
 if(editId){
  const antigo=fal.find(x=>String(x.id)===String(editId));
  if(!antigo)return;
  // Item 48: cada alteração gera histórico com usuário, data/hora, campo, valor anterior e novo valor.
  const usuario=S.sessao?S.sessao.nome:"—",agora=Date.now(),mudancas=[];

  });
  if(novosAnexos.length)mudancas.push({ts:agora,usuario:usuario,campo:"Evidências",

  DB.setFalhas(fal.map(x=>String(x.id)===String(editId)?atualizado:x));

function mudarStatus(id,st){
 const fal=DB.falhas().map(function(r){if(String(r.id)!==String(id))return r;
  const u=Object.assign({},r,{status:st});
  if(st==="liberada"&&!u.liberacao)u.liberacao=Date.now();
  if(st!=="liberada")u.liberacao=null;return u;});
 DB.setFalhas(fal);
 const r=fal.find(x=>String(x.id)===String(id));
 DB.log("status","falha",r.frota+" · "+r.sistema,"Status alterado para "+ST[st].l);toast("Status atualizado",r.frota+" "+mi("arrowRight")+" "+ST[st].l,"info");
 fecharDrawer();render();verFalha(id);
}

 if(rv.length)h+='<div class="gsc">Caminhões</div>'+rv.map(v=>
  '<div class="gsx" onclick="fecharBusca();abrirFrota(\''+esc(v.frota)+'\')">'+
  '<span style="width:30px;height:30px;border-radius:8px;background:var(--acs);color:var(--ac);display:flex;align-items:center;justify-content:center">'+mi('truck')+'</span>'+
  '<div style="flex:1;min-width:0"><div style="font-size:12.5px;font-weight:700">'+esc(v.frota)+(v.placa?' · '+esc(v.placa):"")+'</div>'+
  '<div style="font-size:11px;color:var(--t2)">'+esc(v.modelo)+' · '+esc(v.motorista)+' · '+esc(v.cidade)+'</div></div>'+
  '<span style="color:var(--t3)">'+mi('arrowRight')+'</span></div>').join("");
 if(rf.length)h+='<div class="gsc">Falhas</div>'+rf.map(function(r){const s=ST[r.status];
  return '<div class="gsx" onclick="fecharBusca();verFalha('+qid(r.id)+')">'+
  '<span style="width:30px;height:30px;border-radius:8px;background:'+mix(s.c,14)+';color:'+s.c+';display:flex;align-items:center;justify-content:center">'+s.i+'</span>'+
  '<div style="flex:1;min-width:0"><div style="font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(r.frota)+' — '+esc(r.descricao)+'</div>'+
  '<div style="font-size:11px;color:var(--t2)">'+esc(r.sistema)+' · '+esc(r.componente)+' · '+dOnly(r.registro)+'</div></div>'+
  '<span style="color:var(--t3)">'+mi('arrowRight')+'</span></div>';}).join("");
 if(!h)h='<div style="padding:26px;text-align:center;color:var(--t2);font-size:12.5px">Nenhum resultado encontrado.</div>';
 el.innerHTML=h;
}

/* ═══ IMPORTAÇÃO / EXPORTAÇÃO ═══ */
const COLS=["frota","placa","registro","motorista","km","local","sistema","componente","descricao","sintoma","causa",
 "severidade","criticidade","status","oficina","fornecedor","modelo","fabricante","cidade","filial","custo","liberacao","obs"];
const CABS=["Frota","Placa","Data/Hora","Motorista","KM","Local","Sistema","Componente","Descricao","Sintoma","Causa",
 "Severidade","Criticidade","Status","Oficina","Fornecedor","Modelo","Fabricante","Cidade","Filial","Custo","Liberacao","Observacoes"];
function baixar(blob,nome){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nome;a.click();}
function linhasExport(){
 return filtrar(DB.falhas()).map(function(r){return COLS.map(function(c){
  let v=r[c];
  if(c==="registro"||c==="liberacao")v=v?new Date(v).toLocaleString("pt-BR"):"";
  if(c==="severidade")v=(SEV[v]||{l:v}).l;
  if(c==="criticidade")v=(CRI[v]||{l:v}).l;
  if(c==="status")v=(ST[v]||{l:v}).l;
  return v==null?"":v;});});
}
function exportar(tipo){
 const dados=linhasExport(),hoje=new Date().toISOString().slice(0,10);
 if(tipo==="xlsx"&&typeof XLSX!=="undefined"){
  const ws=XLSX.utils.aoa_to_sheet([CABS].concat(dados));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Falhas");
  XLSX.writeFile(wb,"falhas_makro_"+hoje+".xlsx");
  DB.log("exportar","falhas","","XLSX com "+dados.length+" registros");return;}
 const csv="\uFEFF"+CABS.join(";")+"\n"+dados.map(l=>l.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(";")).join("\n");
 baixar(new Blob([csv],{type:"text/csv;charset=utf-8"}),"falhas_makro_"+hoje+".csv");
 DB.log("exportar","falhas","","CSV com "+dados.length+" registros");
}
function modalImportar(){
 if(!pode("importar"))return alert("Seu perfil não tem permissão para importar dados.");
 abrir('<div class="md" style="max-width:540px"><div class="ph"><div><div class="pt">'+mi('upload')+' Importar falhas</div>'+
  '<div class="ps">Carga inicial ou integração com o Protheus</div></div><button class="b3" onclick="fechar()">'+mi('close')+'</button></div>'+
  '<div style="background:var(--s3);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;font-size:11.5px;line-height:1.6;color:var(--t2);margin-bottom:14px">'+
  '<b style="color:var(--t1)">Formato esperado</b> — CSV com separador ponto e vírgula (;), primeira linha com cabeçalho:<br>'+
  '<code style="color:var(--ac);font-family:monospace;font-size:10.5px">'+CABS.join(";")+'</code><br><br>'+
  'Dica: exporte primeiro um CSV pelo botão "Exportar" para usar como modelo.</div>'+
  '<input class="inp" type="file" id="imp-f" accept=".csv,text/csv" style="padding:8px">'+
  '<div style="display:flex;gap:9px;margin-top:16px;justify-content:flex-end"><button class="b2" onclick="fechar()">Cancelar</button>'+
  '<button class="b1" onclick="processarCSV()">Importar</button></div></div>');
}
function processarCSV(){
 const f=document.getElementById("imp-f").files[0];
 if(!f)return alert("Selecione um arquivo CSV.");
 const rd=new FileReader();
 rd.onload=function(e){try{
  const txt=e.target.result.replace(/^\uFEFF/,"");
  const linhas=txt.split(/\r?\n/).filter(l=>l.trim());
  if(linhas.length<2)return alert("Arquivo sem dados.");
  const sep=linhas[0].indexOf(";")>=0?";":",";
  const cab=linhas[0].split(sep).map(h=>h.replace(/^"|"$/g,"").trim().toLowerCase());
  const ix=n=>cab.findIndex(h=>h.indexOf(n)===0);
  const I={frota:ix("frota"),placa:ix("placa"),data:ix("data"),motorista:ix("motorista"),km:ix("km"),
   local:ix("local"),sistema:ix("sistema"),comp:ix("componente"),desc:ix("descri"),sint:ix("sintoma"),
   causa:ix("causa"),sev:ix("sever"),crit:ix("critic"),st:ix("status"),ofi:ix("oficina"),
   forn:ix("fornec"),mod:ix("modelo"),fab:ix("fabric"),cid:ix("cidade"),fil:ix("filial"),custo:ix("custo")};
  if(I.frota<0||I.placa<0)return alert("Cabeçalho inválido: as colunas Frota e Placa são obrigatórias.");
  const parse=function(l){const out=[];let cur="",q=false;
   for(let k=0;k<l.length;k++){const ch=l[k];
    if(ch==='"'){if(q&&l[k+1]==='"'){cur+='"';k++;}else q=!q;}
    else if(ch===sep&&!q){out.push(cur);cur="";}else cur+=ch;}
   out.push(cur);return out.map(s=>s.trim());};
  const chave=function(t){const m={leve:"leve",moder:"moderada",grave:"grave",crit:"critica",
   baixa:"baixa",media:"media","médi":"media",alta:"alta",urgen:"urgente",
   abert:"aberta","anális":"analise",analis:"analise",aguard:"aguardando",liber:"liberada"};
   const s=(t||"").toLowerCase();for(const k in m)if(s.indexOf(k)>=0)return m[k];return null;};
  const fal=DB.falhas();let novoId=Math.max.apply(null,[0].concat(fal.map(r=>r.id))),add=0;
  for(let n=1;n<linhas.length;n++){
   const c=parse(linhas[n]);if(!c[I.frota])continue;
   const val=(i,d)=>i>=0&&c[i]?c[i]:d;
   let ts=Date.now();
   if(I.data>=0&&c[I.data]){const p=c[I.data].match(/(\d{2})\/(\d{2})\/(\d{2,4})[, ]*(\d{2})?:?(\d{2})?/);
    if(p){const ano=p[3].length===2?"20"+p[3]:p[3];ts=new Date(+ano,+p[2]-1,+p[1],+(p[4]||0),+(p[5]||0)).getTime();}
    else{const d2=new Date(c[I.data]);if(!isNaN(d2))ts=d2.getTime();}}
   const st=chave(val(I.st,"aberta"))||"aberta";
   fal.push({id:++novoId,frota:c[I.frota].toUpperCase(),placa:val(I.placa,"").toUpperCase(),
    motorista:val(I.motorista,"—"),km:parseInt(val(I.km,0))||0,local:val(I.local,""),
    sistema:val(I.sistema,"Outros"),componente:val(I.comp,""),descricao:val(I.desc,"(sem descrição)"),
    sintoma:val(I.sint,""),causa:val(I.causa,""),
    severidade:chave(val(I.sev,""))||"moderada",criticidade:chave(val(I.crit,""))||"media",
    status:st,oficina:val(I.ofi,""),fornecedor:val(I.forn,"—"),modelo:val(I.mod,""),
    fabricante:val(I.fab,""),cidade:val(I.cid,""),filial:val(I.fil,""),
    custo:parseInt(val(I.custo,0))||0,registro:ts,liberacao:st==="liberada"?ts+36e5:null,obs:"",anexos:[]});
   add++;}
  DB.setFalhas(fal);DB.log("importar","falhas","",add+" registros importados de "+f.name);
  fechar();render();alert(add+" falha(s) importada(s) com sucesso.");
 }catch(err){alert("Não foi possível ler o arquivo. Verifique o formato.");}};
 rd.readAsText(f,"UTF-8");
}

/* ═══ OVERLAYS ═══ */
function abrir(html){fechar();  // evita empilhar dois modais com o mesmo id
 const d=document.createElement("div");d.className="ov";d.id="ov";
 d.onclick=e=>{if(e.target===d)fechar();};d.innerHTML=html;document.body.appendChild(d);}
function fechar(){const d=document.getElementById("ov");if(d)d.remove();}
function abrirDrawer(html){fecharDrawer();const d=document.createElement("div");d.className="ov";d.id="ovd";
 d.style.justifyContent="flex-end";d.onclick=e=>{if(e.target===d)fecharDrawer();};
 d.innerHTML=html;document.body.appendChild(d);}
function fecharDrawer(){const d=document.getElementById("ovd");if(d)d.remove();}

/* ═══ ATALHOS ═══ */
/* Item 51: atalhos de teclado para as ações mais usadas */
document.addEventListener("keydown",function(e){
 const emCampo=/^(INPUT|TEXTAREA|SELECT)$/.test((e.target&&e.target.tagName)||"");
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();if(S.sessao)buscaGlobal();}
 if(e.key==="Escape"){fecharBusca();fechar();fecharDrawer();}
 if(!S.sessao||emCampo||e.ctrlKey||e.metaKey||e.altKey)return;
 const k=e.key.toLowerCase();
 if(k==="n"&&pode("criar")){e.preventDefault();modalFalha(S.frotaAtiva||null);}
 else if(k==="f"){e.preventDefault();
  const i=document.getElementById("fq")||document.getElementById("fqs")||document.getElementById("fsq");
  if(i)i.focus();}
 else if(k==="?"||(e.shiftKey&&k==="/")){e.preventDefault();
  alert("Atalhos de teclado\n\nN — Novo registro de falha\nF — Ir para o campo de busca\nCtrl+K — Busca global\nEsc — Fechar janela aberta");}
});

(async function(){
 favicon();
 const c=DB.cfg();S.tema=c.tema||"dark";S.menu=c.menu!==false;
 document.documentElement.setAttribute("data-theme",S.tema);
 splash();

 // A base local SEMPRE é preparada, mesmo com a nuvem configurada.
 // Ela garante o catálogo de componentes (que não existe no Supabase) e
 // um acesso de emergência caso o banco ainda não esteja pronto.
 await semear();
 importarFrotaPlanilha();

 if(supaConfigurado()&&initSupabase()){
  try{
   const {data}=await SUPA.client.auth.getSession();
   if(data&&data.session&&data.session.user){
    const ok=await iniciarSessaoSupabase(data.session.user);
    if(ok){render();return;}
   }
  }catch(e){SUPA.erro=e.message;}
  render();return;                       // configurado mas sem sessão → tela de login
 }

 try{const s=localStorage.getItem("sgfpro:sessao")||sessionStorage.getItem("sgfpro:sessao");if(s)S.sessao=JSON.parse(s);}catch(e){}
 if(S.sessao)DB.backupAuto();
 render();
})();
</script>
